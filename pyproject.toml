[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner"
dynamic = ["version"]
description = "N Claude Code sessions working through a markdown task list, unattended: worktrees, a test gate, merges, pushes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "FIZL0" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/FIZL0/agent-runner"

[project.scripts]
agent-runner = "agent_runner.cli:main"

[tool.setuptools]
packages = ["agent_runner", "agent_runner.example"]
# the example project `agent-runner demo` copies: plain files, shipped inside the package
package-dir = { "agent_runner.example" = "examples/hello" }

[tool.setuptools.dynamic]
version = { attr = "agent_runner.__version__" }

[tool.setuptools.package-data]
agent_runner = ["web_page.html", "harness.mjs"]
"agent_runner.example" = ["*", "**/*", ".gitignore", "journal/.keep"]

[tool.setuptools.exclude-package-data]
"agent_runner.example" = ["__pycache__/*"]
