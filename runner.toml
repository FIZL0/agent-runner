# agent-runner's own settings for this repo (every key: docs/REFERENCE.md#runnertoml)

[plan]
outline = "python3 tools/outline.py {file}"  # the brief's map of each big file a task names
lessons = true  # plan/LESSONS.md: what agents learned, shown in briefs whose files it names

[run]
rules = "AGENTS.md"  # the short rules file every slot is pointed at
auto_upgrade = true  # upgrade agent-runner by itself when a newer release is out, between merges
auto_release = { "every" = 10, "idle" = true }  # queue a release by itself when the run goes idle with landed work
# The gate `done` and every merge run: each tests/test_*.py suite in turn, stopping at the first failure.
test = "for t in tests/test_*.py; do echo \"== $t\"; python3 \"$t\" || exit 1; done"
# Every task appends to the changelog: the merge joins those appends itself (joinable), so no fix session is
# needed; shared_files only keeps an overlap from holding a task back. A plain line union would put an entry
# written before a release under the released version, so tools/changelog_join.py (below) joins it.
joinable = ["CHANGELOG.md", "plan/LESSONS.md"]
shared_files = ["CHANGELOG.md", "docs/STYLE.md"]
prompt_extra = """
A task that changes how the run app looks, moves or speaks (agent_runner/page/*, the parts of the run app's page; Runner Home's page): read
docs/STYLE.md first and follow it; a change that needs a new rule writes the rule there in the same commit."""
weekly_max = 100
session_max = 100

# The phone is iFizBox's: its script says who has it, with the same exits (0 free, 75 busy, 69 missing).
[run.tools.iphone15]
check = 's="$HOME/repos/iFizBox/tools/ui-15.sh"; [ -x "$s" ] || { echo "no iFizBox tools/ui-15.sh in ~/repos on this machine"; exit 69; }; "$s" state'
label = "iPhone 15 Pro"
description = "iFizBox's test phone, on this desktop's USB; drive it only through ~/repos/iFizBox/tools/ui-15.sh (lock it first, unlock it after)."

[run.join]
"CHANGELOG.md" = "python3 tools/changelog_join.py {ours} {base} {theirs} {out}"

[models]
provider = "copilot"
