# agent-runner's own settings for this repo (every key: docs/REFERENCE.md#runnertoml)

[run]
auto_upgrade = true  # upgrade agent-runner by itself when a newer release is out, between merges
# The gate `done` and every merge run: each tests/test_*.py suite in turn, stopping at the first failure.
test = "for t in tests/test_*.py; do echo \"== $t\"; python3 \"$t\" || exit 1; done"
# Every task appends to the changelog and the merge repair joins those appends, so it holds no task back.
shared_files = ["CHANGELOG.md"]
