<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>agent-runner</title>
<script>
/* F81: the view this browser last chose (localStorage), else [ui] web (the server writes it into WEB_VIEW): on
   'terminal' the link opens the terminal-style page (/term) instead. */
const WEB_VIEW=/*WEB_VIEW*/'app', VIEW_KEY='agent-runner.view';
(()=>{let v='';try{v=localStorage.getItem(VIEW_KEY)||''}catch(e){}
  if((v||WEB_VIEW)==='terminal')location.replace('term'+location.search)})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* F79: the run app, a calm chat app over F74's model (the snapshot, the feeds, the actions). Warm off-white
   (dark: warm grey), serif for headings and replies, a rust accent, thin line icons, one big rounded message
   box. It switches layout by its own width (container query): a sidebar on a desktop, a drawer on a phone. */
:root{
  --bg:#faf9f5; --side:#f5f4ee; --surface:#ffffff; --bubble:#f0eee6; --fg:#141413; --muted:#73726c; --faint:#a3a199;
  --line:#e8e6dc; --line2:#dcd9cd; --accent:#c96442; --accent2:#b5573a; --onaccent:#ffffff; --ok:#4f7a43;
  --warn:#a8711a; --bad:#b0412e; --scrim:rgba(0,0,0,.25); --shadow:rgba(0,0,0,.15);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:none} *::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);overflow:hidden}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{container-type:inline-size;height:100vh;height:100dvh;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.shell{flex:1;min-height:0;min-width:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr)}

/* the sidebar: a drawer on a phone */
.side{position:absolute;inset:0 auto 0 0;width:280px;max-width:85%;background:var(--side);border-right:1px solid var(--line);z-index:6;
  transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:12px 10px;
  padding-left:max(10px,env(safe-area-inset-left,0px));overflow:auto}
.side.open{transform:none;box-shadow:8px 0 30px var(--shadow)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5;display:none}
.scrim.on{display:block}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font:600 13px var(--serif);flex:none}
.brand b{font:500 17px var(--serif)}
.newchat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:500;color:var(--accent)}
.newchat .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
.newchat .plus svg{width:14px;height:14px;stroke-width:2.2}
.nav{display:grid;gap:1px;margin-top:6px}
.ni{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--fg)}
.ni:hover{background:var(--bubble)} .ni.on{background:var(--bubble);font-weight:500}
.ni .n{margin-left:auto;font-size:12px;background:var(--accent);color:var(--onaccent);border-radius:99px;padding:0 7px}
.shead{font-size:12px;color:var(--muted);padding:14px 10px 4px}
.shead.row{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.shadd{width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.shadd:hover{background:var(--bubble);color:var(--fg)} .shadd svg{width:16px;height:16px;stroke-width:2}
.thread{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font-size:14px}
.thread:hover{background:var(--bubble)} .thread.on{background:var(--bubble)}
.thread .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .off{width:7px;height:7px;border-radius:50%;border:1px solid var(--faint);flex:none}
/* F118: a chat row's delete button (on hover; always on touch), its Undo, the selection and its Delete N bar */
.crow{position:relative} .crow .thread{padding-right:38px}
.crow .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:28px;min-width:28px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;font-size:12px;font-weight:500}
.crow:hover .del,.crow:focus-within .del,.crow .del.undo{opacity:1} .crow .del:hover{background:var(--line2);color:var(--fg)}
.crow .del svg{width:15px;height:15px} .crow .del.undo{padding:0 8px;color:var(--accent)}
@media (hover:none){.crow .del{opacity:1}}
.thread.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.thread.gone{opacity:.5;cursor:default} .thread.gone .t{text-decoration:line-through}
.selbar{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:13px;color:var(--muted)} .selbar span{flex:1}
.selbar .btn{padding:4px 10px;font-size:13px}
.none{font-size:13px;color:var(--faint);padding:4px 10px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 12px var(--sans);flex:none}
.me .sub{font-size:11px}
.viewsw{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-size:12px;color:var(--muted);text-decoration:none}
.viewsw:hover{color:var(--fg)} .viewsw svg{width:15px;height:15px}

/* the main column */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;padding-right:max(10px,env(safe-area-inset-right,0px))}
.icon{width:36px;height:36px;border-radius:10px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.icon:hover{background:var(--bubble)}
.top .title{flex:1;min-width:0;text-align:center;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow:auto;min-height:0}
.col{max-width:720px;margin:0 auto;padding:6px 16px 24px;display:grid;gap:12px}
.greet{font:400 30px/1.2 var(--serif);text-align:center;margin:18px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px}
.greet .logo{width:30px;height:30px;font-size:15px}
.sec{font-size:13px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.sec .ln{flex:1;height:1px;background:var(--line)}
.kform{display:grid;gap:8px} .kform textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--fg);resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card.tap{cursor:pointer} .card.tap:hover{border-color:var(--line2)}
.card.need{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.q{font:500 17px/1.35 var(--serif);overflow-wrap:anywhere}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{width:34px;height:34px;border-radius:10px;background:var(--bubble);display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted);flex:none}
.status{font-size:12px;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.quote{font:400 15px/1.45 var(--serif);color:var(--fg);border-left:2px solid var(--line2);padding-left:10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bubble)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.acc{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.bad{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.sure{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.slotsn{display:inline-flex;gap:6px;align-items:center}
.slotsn input{width:64px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 8px;font:inherit}
.chev{color:var(--faint);display:grid}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.chip svg{width:15px;height:15px;color:var(--muted)}
.chip:hover{background:var(--bubble)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:4px 2px;min-width:0}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bubble);color:var(--muted)}
.ev .ic svg{width:14px;height:14px}
.ev .ic.ok{color:var(--ok)} .ev .ic.bad{color:var(--bad)} .ev .ic.go{color:var(--accent)}
.ev .txt{min-width:0;overflow-wrap:anywhere}

/* the message box */
.box{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:12px 12px 10px 16px;display:grid;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin:0}
.box:focus-within{border-color:var(--faint)}
.box textarea{border:0;outline:0;resize:none;background:none;font:16px/1.45 var(--sans);color:var(--fg);min-height:26px;max-height:160px;padding:2px 0;width:100%}
.box textarea::placeholder{color:var(--faint)}
.boxrow{display:flex;align-items:center;gap:6px}
.tool{height:32px;min-width:32px;border-radius:9px;border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;cursor:pointer;color:var(--muted);font-size:13px}
.tool:hover{background:var(--bubble);color:var(--fg)}
.to{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.send{margin-left:auto;width:32px;height:32px;border-radius:9px;border:0;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;cursor:pointer;flex:none}
.send.stop{background:var(--fg);color:var(--bg)} .send.stop+.send{margin-left:0}
.send:disabled{opacity:.4;cursor:default}
.send svg{stroke-width:2.2}
.ctx{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.ctx b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.x{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 4px}
.atts{display:flex;gap:8px;flex-wrap:wrap}
.att{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;font-size:12px;background:var(--bg);max-width:220px}
.att span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.att img,.att .fi{width:34px;height:34px;border-radius:7px;object-fit:cover;background:var(--bubble);display:grid;place-items:center;flex:none}
.att.up{opacity:.55} .att.err{border-color:var(--bad)}
.att .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;line-height:1;padding:0}
.dock{padding:8px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .box{max-width:720px;margin:0 auto}
.foot{font-size:11px;color:var(--faint);text-align:center;margin-top:6px}

/* a conversation */
.msgs{display:grid;gap:18px;padding:8px 0 10px}
.u{justify-self:end;max-width:80%;background:var(--bubble);border-radius:18px;padding:9px 14px;display:grid;gap:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.u.pending{opacity:.7}
.u img{max-width:200px;border-radius:10px}
.u .file{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.a{display:grid;gap:8px;font:400 16.5px/1.6 var(--serif);max-width:100%;min-width:0;overflow-wrap:anywhere}
.a .lead{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted)}
.a .lead .logo{width:22px;height:22px;font-size:11px;border-radius:6px}
.a p{margin:0} .a ul,.a ol{margin:0;padding-left:1.3em}
.a code{font:13.5px var(--mono);background:var(--bubble);border-radius:5px;padding:1px 5px}
.a pre{font:12.5px/1.55 var(--mono);background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow:auto;margin:0;white-space:pre}
.a pre code{background:none;padding:0}
.a h1,.a h2,.a h3,.a h4{font:600 16.5px/1.4 var(--serif);margin:0}
.steps{display:inline-flex;align-items:center;gap:6px;font:400 13px var(--sans);color:var(--muted);border:0;background:none;padding:0;cursor:pointer;justify-self:start}
.steps svg{width:14px;height:14px;transition:transform .15s}
.steps.open svg{transform:rotate(90deg)}
.stepbox{font:12.5px/1.6 var(--mono);color:var(--muted);background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.stepbox .o{color:var(--faint)}
.think{display:flex;align-items:center;gap:8px;font:13px var(--sans);color:var(--muted)}
.think .logo{width:20px;height:20px;font-size:10px;border-radius:6px;animation:pulse 1.2s infinite}
.think .btn.mini{padding:2px 10px;font-size:12px;margin-left:4px}
.more{font-size:12px;color:var(--faint);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:12px;padding:9px 14px;font-size:13px;z-index:20;max-width:min(560px,90vw);box-shadow:0 6px 24px var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.offline{font-size:12px;color:var(--warn);text-align:center;padding:2px}

@container (min-width:760px){
  .shell{grid-template-columns:260px minmax(0,1fr)}
  .side{position:static;transform:none;box-shadow:none;width:auto;max-width:none}
  .scrim,.top .menu{display:none!important}
  .top{padding:12px 18px 6px}
  .top .title{text-align:left}
  .grid2{grid-template-columns:1fr 1fr}
}
.grid2{display:grid;gap:12px}
/* F93: Talk: a big mic button over the chat box */
.talk{display:grid;justify-items:center;gap:8px;max-width:720px;margin:0 auto 10px}
.mic{width:min(38vw,132px);height:min(38vw,132px);border-radius:50%;border:0;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 24px var(--shadow);touch-action:manipulation}
.mic svg{width:44%;height:44%;stroke-width:1.8}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
.mic.speaking{background:var(--accent2)}
.mic:disabled{background:var(--line2);color:var(--muted);cursor:default;box-shadow:none}
.talkline{font:15px/1.45 var(--sans);color:var(--muted);text-align:center;min-height:1.45em;max-width:34em;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
/* B119: the slash command menu, above the message box */
.box{position:relative}
.slash{position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:min(320px,50vh);overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:4px;box-shadow:0 6px 24px var(--shadow);z-index:5}
.slash button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;color:var(--fg);text-align:left;padding:7px 10px;border-radius:9px;cursor:pointer;font:14px/1.35 var(--sans);min-width:0}
.slash button.on{background:var(--bubble)}
.slash b{font-weight:500;white-space:nowrap}
.slash span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (prefers-reduced-motion:reduce){.side,.steps svg{transition:none}.livedot,.think .logo{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="shell">
    <div class="scrim" id="scrim"></div>
    <aside class="side" id="side" aria-label="Sidebar"></aside>
    <section class="main">
      <div class="top" id="top"></div>
      <div class="offline" id="offline" hidden>Lost the run page's connection: trying again…</div>
      <div class="body" id="body"></div>
      <div class="dock" id="dock"></div>
    </section>
  </div>
  <input type="file" multiple hidden id="file">
</div>
<div class="toast" id="toast" hidden></div>

<script id="logic">
/* The page's pure parts, run in node by tests/test_web.py: no DOM here. */
/* a Needs you item's possible answers (F74): yes / no for a CONFIRM or a yes-or-no ask, else its options */
function answerOpts(it){
  if(!it)return[];
  const opts=Array.isArray(it.options)&&it.options.length?it.options.map(String):
    it.label==='CONFIRM'||/\byes ?(\/|or) ?no\b/i.test(it.ask||'')?['Yes','No']:[];
  return opts.map(o=>o.charAt(0).toUpperCase()+o.slice(1));
}
/* a session's feed entries (say / you / tool / out) as a conversation: your words as {w:'u'}, the agent's as
   {w:'a', text, steps}; tool steps (and their output) fold into the reply that follows them */
function threadMsgs(entries){
  const out=[];let steps=[];
  for(const e of entries||[]){
    if(e.kind==='tool')steps.push({tool:e.text,out:''});
    else if(e.kind==='out'){if(steps.length&&!steps[steps.length-1].out)steps[steps.length-1].out=e.text;else steps.push({tool:'',out:e.text})}
    else if(e.kind==='say'){out.push({w:'a',text:e.text,steps});steps=[]}
    else if(e.kind==='you'){if(steps.length)out.push({w:'a',text:'',steps}),steps=[];out.push({w:'u',text:e.text})}
  }
  if(steps.length)out.push({w:'a',text:'',steps});
  return out;
}
/* is the session working: its last entry is a tool step, its output, or your words not yet answered */
function working(entries){
  const l=(entries||[])[(entries||[]).length-1];
  if(!l)return false;
  if(l.kind==='out'&&l.text==='interrupted')return false;
  return l.kind!=='say';
}
/* a queued task's state, in plain words */
function planWords(q,sessions){
  const s=(sessions||[]).find(x=>x.task===q.id);
  if(q.state==='running')return s?`${s.name} is on it${s.minutes!=null?` · ${s.minutes} min`:''}`:'Being worked on';
  if(q.state==='blocked')return 'Waits for you';
  if(q.state==='critical')return 'Goes first, as soon as a slot is free';
  if(q.state==='after')return q.after_title?`Waits for ${q.after_title}`:'Waits for another task';
  if(q.state==='parked')return "Parked: a run won't start it";  // B118: never 'Ready'

/* what the message box sends: the About line, your words, then the attachments' paths on this machine */
function compose(ctx,text,paths){
  text=String(text||'').trim();

  else if(ctx&&ctx.kind==='plan')msg=`About ${ctx.id}${ctx.title?` (${ctx.title})`:''}: ${text}`;
  else if(ctx&&ctx.kind==='concept')msg=`About concept ${ctx.id}${ctx.title?` (${ctx.title})`:''}: ${text}`;
  else if(ctx&&ctx.kind==='need')msg=`About ${ctx.id}${ctx.title?` (${ctx.title})`:''}, which needs me: ${text}`;
  if(paths&&paths.length)msg+=(msg?'\n\n':'')+'Attached: '+paths.join(', ');

/* the usage line of the status lines ('usage: session 40%, week 12%'), '' for none */
const usageOf=status=>((status||[]).find(l=>/^usage: /.test(l))||'').replace(/^usage: /,'');
/* a run log line's kind, for its icon on Activity */
function logKind(line){

  if(/\b(stuck|failed|error|blocked|refused)\b/.test(l))return 'bad';

  .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^\s*(?:[-*]|\d+[.)]|#+)\s+/gm,'').replace(/\s+/g,' ').trim();

/* F82: a run control's request to /act (run_control, from the snapshot's one list of controls): o.n the slot

const taskControlsOn=s=>!!(s&&s.task&&s.state!=='merging');
/* B118: the Queue's two groups: [the queue a run works through, the Parked tasks it never starts] */

const optionName=o=>o.name.replace(/\s*[(\[—–-]*\s*recommended\s*[)\]]?\s*$/i,'')||o.name;

function newConceptReq(text){const t=String(text||'').trim();return t?{name:'plan_add',args:{kind:'K',text:t}}:null}

/* F93: Talk. The sidebar's views, Talk first; its control session: the one this browser remembers while it is
   live, else a live chat titled Talk, else '' (the next send opens one) */
const NAV=[['talk','Talk'],['home','Home'],['agents','Agents'],['activity','Activity'],['plan','Plan'],['concepts','Concepts']];
function talkSession(sessions,remembered){

   hides speech recognition outside a secure context, so plain http is checked first */
function micProblem(secure,hasRecognition){

  if(!hasRecognition)return 'This browser cannot turn speech into text (Chrome, Edge and Safari can). Type below instead.';

const heardNothing=err=>err?`Heard nothing (error: ${err})`:'Heard nothing';

const talkShown=t=>{t=String(t||'');const i=t.indexOf('\n\nThey said: ');

/* the reply to read aloud: the session's words after feed entry `since`, once its last entry is its words
   ('' while it still works or has said nothing new) */
function talkReply(entries,since){

/* F118: the chats picked for delete after a click on `name`: `names` the chats in list order, `sel` those picked,
   `last` the last one clicked, `how` 'toggle' (Ctrl/Cmd+click: in or out), 'range' (Shift+click: every chat from
   `last` to `name`), else a plain click (nothing picked, `name` the new last). c1, the Project chat, is never picked. */
function chatPick(names,sel,last,name,how){
  names=names||[];const ok=n=>n!=='c1'&&names.includes(n);
  const order=s=>names.filter(n=>s.has(n));

    return{sel:order(new Set(names.slice(a,b+1).filter(ok))),last};
  }

/* B119: the message box's slash command menu. SLASH_FALLBACK, the commands it offers when the run page cannot
   give the session's own list (/commands) */
const SLASH_FALLBACK=[['run',"The run's status"],['since','What the run did since the last look'],['follow','Follow the run live'],
  ['control','Open another control session'],['pause','Pause the run, or go on'],['stop','Stop the run'],
  ['slots','More or fewer agents'],['clear','Start the conversation over'],['compact','Summarise the conversation so far to free context']]
  .map(([name,desc])=>({name,desc}));
/* the commands that match the box: only while it holds one word that starts with '/', names that start with what
   follows first, then names that hold it; [] closes the menu */
function slashMatches(cmds,text){
  const m=/^\/(\S*)$/.exec(String(text||''));if(!m)return[];
  const q=m[1].toLowerCase(), cs=cmds&&cmds.length?cmds:SLASH_FALLBACK, nm=c=>String(c.name).toLowerCase();
  return cs.filter(c=>nm(c).startsWith(q)).concat(cs.filter(c=>!nm(c).startsWith(q)&&nm(c).includes(q)));
}
/* the box's words once a command is picked */
const slashPick=c=>`/${c.name} `;
/* the highlighted row after ArrowDown / ArrowUp, wrapping round the n rows */
const slashMove=(i,n,key)=>n?(key==='ArrowUp'?(i-1+n)%n:(i+1)%n):0;
/* B120: the message box's keys, as in the agent CLI's own input, listed here once (the box's foot shows them) */
const BOX_KEYS=[['Enter','sends'],['Shift+Enter','new line'],['↑ ↓','earlier messages'],['/','commands'],
  ['Esc','closes the menu, then interrupts'],['Ctrl+C','interrupts'],['Paste','attaches pictures or files']];
const keysLine=()=>BOX_KEYS.map(([k,d])=>`${k} ${d}`).join(' · ');
/* B120: the chat's message history (kept per chat): HIST_MAX the most it keeps; histPush the list once `text` is
   sent (not twice in a row); histEdge whether ArrowUp / ArrowDown leaves the box's text for history (the caret on
   its first / last line, nothing selected); histStep the place after the key, n meaning the unsent draft */
const HIST_MAX=100;

  const t=String(text||'').trim(), l=(Array.isArray(list)?list:[]).filter(x=>typeof x==='string');

/* --- a little markdown for replies: code blocks, inline code, bold, links, lists, headings ------------------ */
function md(src){
  const parts=String(src||'').split(/```[^\n]*\n?/);let h='';
  parts.forEach((p,i)=>{
    if(i%2){h+=`<pre><code>${esc(p.replace(/\n$/,''))}</code></pre>`;return}
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    for(const block of p.split(/\n{2,}/)){
      const b=block.trim();if(!b)continue;const ls=b.split('\n');
      if(ls.every(l=>/^\s*[-*] /.test(l)))h+='<ul>'+ls.map(l=>`<li>${inline(l.replace(/^\s*[-*] /,''))}</li>`).join('')+'</ul>';
      else if(ls.every(l=>/^\s*\d+[.)] /.test(l)))h+='<ol>'+ls.map(l=>`<li>${inline(l.replace(/^\s*\d+[.)] /,''))}</li>`).join('')+'</ol>';
      else if(/^#{1,4} /.test(b)&&ls.length===1)h+=`<h3>${inline(b.replace(/^#+ /,''))}</h3>`;
      else h+=`<p>${ls.map(inline).join('<br>')}</p>`;
    }
  });

}

/* --- F93: Talk: the mic hears the person (Web Speech API), the words go to the Talk session (the `talk` action),
   and its reply is read aloud (speechSynthesis); the chat box under the mic works without either ------------- */
const TALK_KEY='ar-talk';  /* the Talk session this browser opened */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TK={rec:null,heard:'',state:'',wait:null,said:'',unlocked:false,note:''};  /* state: '', listening, thinking, speaking */
function talkName(){
  const n=talkSession(S.snap.sessions,store.get(TALK_KEY));if(n)return n;
  const w=TK.wait;return w&&Date.now()-w.at<90000?w.n:'';  /* just opened: not in the snapshot yet */

/* B133: the session a Talk reply is awaited from ('' for none): a wait opened with no session name takes the live
   chat titled Talk once the snapshot lists it */
function talkWaitName(){
  const w=TK.wait;if(!w)return '';
  if(!w.n){const t=talkSession(S.snap.sessions,'');if(t){w.n=t;store.set(TALK_KEY,t)}}
  return w.n;
}
const micWhy=()=>micProblem(window.isSecureContext!==false,!!SR);
function talkHTML(){
  const n=talkName();
  if(!n)return `<div class="col"><div class="greet"><span class="logo">ar</span>Talk to the run</div><div class="small" style="text-align:center">Tap the mic and ask, say, what is going on: the reply is read aloud. Talk opens a chat of its own the first time.</div></div>`;
  if(!S.feeds[n]&&!TK.loading){TK.loading=true;loadFeed(n).finally(()=>{TK.loading=false})}  /* its first look */
  return `<div class="col">${convo(n,talkShown)}</div>`;
}
function talkDock(){
  const why=micWhy(), st=TK.state;
  const line=why||(st==='listening'?(TK.heard||'Listening…'):st==='thinking'?'Thinking…':st==='speaking'?'Speaking. Tap to stop.':(TK.note||'Tap to talk'));
  const label=why||(st==='listening'?'Stop listening':st==='speaking'?'Stop speaking':'Talk');
  return `<div class="talk"><button type="button" class="mic ${st==='listening'?'on':st==='speaking'?'speaking':''}" data-mic aria-label="${esc(label)}" title="${esc(label)}" ${why?'disabled':''}>${st==='speaking'?I.stop:I.talk}</button><div class="talkline" role="status">${esc(line)}</div></div>`
    +box('Or type to Talk','Replies are read aloud.');
}
/* the person's words to the Talk session; true once sent */
async function talkSend(msg){
  const to=talkName(), len=to?feedOf(to).length:0;
  TK.state='thinking';TK.said=msg;TK.note='';unlockSpeech();render(true);
  /* B133: the wait starts before the action, which can take up to 90 s while a new chat comes up: a reply that
     lands meanwhile is heard from the polls and snapshots (talkWaitName finds the new chat by its title) */
  const w={n:to,since:len,at:Date.now(),last:''};TK.wait=w;
  const r=await act('talk',{text:msg,to});
  if(!r.ok){if(TK.wait===w)TK.wait=null;TK.state='';render(true);return false}
  const n=r.session||to, fresh=n!==to;
  if(TK.wait===w){if(fresh){w.n=n;w.since=0;w.last=''}w.at=Date.now()}  /* not yet heard; n '': found by its title */
  if(n){store.set(TALK_KEY,n);S.sent[n]={at:Date.now(),len:fresh?0:len,pending:[msg]};loadFeed(n)}
  else if(TK.wait===w&&!w.n)toast('Talk is opening its chat: it shows here once it is up');
  render(true);return true;
}
/* a new feed for session n: once the Talk reply has stood for one poll, read it aloud */
function talkHear(n){
  const w=TK.wait;if(!w||talkWaitName()!==n)return;
  if(Date.now()-w.at>300000){TK.wait=null;if(TK.state==='thinking'){TK.state='';toast('No spoken reply came in five minutes: its chat shows where it is.',true);render(true)}return}
  const said=talkReply(feedOf(n),w.since);
  if(!said||said!==w.last){w.last=said;return}
  TK.wait=null;speak(said);

function unlockSpeech(){  /* Safari speaks later only after a first utterance inside a tap */
  try{if(window.speechSynthesis&&!TK.unlocked){speechSynthesis.speak(new SpeechSynthesisUtterance(''));TK.unlocked=true}}catch(e){}
}
function speak(text){
  const ss=window.speechSynthesis;
  if(!ss||!text){TK.state='';render(true);return}
  ss.cancel();
  const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text];  /* sentence by sentence: Chrome cuts one long utterance short */
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=navigator.language||'en-US';
    if(i===parts.length-1)u.onend=u.onerror=()=>{if(TK.state==='speaking'){TK.state='';render(true)}};
    ss.speak(u)});

function listen(){
  const why=micWhy();if(why)return toast(why,true);

  rec.onerror=e=>{err=e.error||'';if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('The browser did not let the page use the mic: allow it in the site settings, or type below.',true);
    else if(e.error!=='no-speech'&&e.error!=='aborted')toast(`The mic stopped: ${e.error}`,true)};
  rec.onend=()=>{TK.rec=null;const t=(final||TK.heard).trim();TK.heard='';if(TK.state==='listening')TK.state='';
    if(t)talkSend(t);else{TK.note=heardNothing(err);render(true)}};
  TK.state='listening';TK.heard='';render(true);
  try{rec.start()}catch(e){TK.state='';TK.rec=null;toast(`The mic could not start: ${e.message||e}`,true);render(true)}
}

/* --- live data --------------------------------------------------------------------------------------------- */
/* F90: the run's version from the first snapshot that has one; a later, different one (the run restarted on an
   upgrade) reloads the page for its new HTML and JS. None (an older run): nothing. */
let RUN_VERSION='';
function followVersion(v){if(!v)return false;if(!RUN_VERSION){RUN_VERSION=v;return false}
  if(v!==RUN_VERSION){location.reload();return true}return false}
function takeSnap(s){
  if(!s||s.error){if(s&&s.error)toast(s.error,true);return}
  if(followVersion(s.version))return;
  S.snap={...S.snap,...s};
  if(S.waitNew){const fresh=chats().map(c=>c.name).filter(x=>!S.waitNew.known.includes(x));
    if(fresh.length){S.waitNew=null;open(fresh[fresh.length-1]);return}
    if(Date.now()-S.waitNew.at>60000)S.waitNew=null}
  for(const w of working_())if(!S.feeds[w.name]||Date.now()-(S.feeds[w.name].at||0)>15000)loadFeed(w.name);
  const tw=talkWaitName();if(tw)loadFeed(tw);  // B133: each snapshot also looks for the awaited Talk reply
  render();
}
function connect(){
  let es;try{es=new EventSource(tq('events'))}catch(e){return poll()}
  let lost=0;  /* the banner shows only when no snapshot came for a while, not on every reconnect */
  const fine=()=>{clearTimeout(lost);lost=0;$('offline').hidden=true};
  es.onmessage=e=>{fine();try{takeSnap(JSON.parse(e.data))}catch(x){}};
  es.onerror=()=>{if(!lost)lost=setTimeout(()=>{$('offline').hidden=false},8000)};
}
async function poll(){try{takeSnap(await (await fetch(tq('snapshot'))).json())}catch(e){}setTimeout(poll,4000)}
async function loadFeed(n){
  try{const f=await (await fetch(tq('feed/'+encodeURIComponent(n)))).json();
    const old=S.feeds[n];S.feeds[n]={...f,at:Date.now()};
    const sent=S.sent[n];if(sent&&(f.entries||[]).length>sent.len)sent.pending=[];
    talkHear(n);  // F93
    if(!old||JSON.stringify(old.entries)!==JSON.stringify(f.entries)||old.out!==f.out)render()}
  catch(e){}
}
setInterval(()=>{if(S.thread&&!document.hidden)loadFeed(S.thread)},2000);
setInterval(()=>{const w=talkWaitName(), n=talkName();  // F93; B133: an awaited reply is polled in any view
  if(w)loadFeed(w);else if(n&&!S.thread&&S.view==='talk')loadFeed(n)},2000);

/* --- doing things ------------------------------------------------------------------------------------------ */
function open(n){S.thread=n;S.drawer=false;loadFeed(n);render(true);setTimeout(()=>document.querySelector('[data-in]')?.focus(),50)}
function goView(v){S.view=v;S.thread=null;S.ctx=null;S.drawer=false;S.kSaid='';render(true)}
async function send(){
  const ta=document.querySelector('[data-in]');const text=(ta?.value||'').trim();
  if(S.atts.some(a=>!a.path&&!a.err))return toast('Wait for the attachments to finish uploading');
  const paths=S.atts.filter(a=>a.path).map(a=>a.path);
  if(!text&&!paths.length)return;
  if(!S.thread&&S.view==='talk'){if(await talkSend(compose(null,text,paths))){histAdd(boxKey(),text);HI.i=null;store.set(DRAFT_KEY(boxKey()),'');if(ta)ta.value='';S.atts=[];render(true)}return}  // F93
  const ctx=S.ctx, to=S.thread||'c1', key=boxKey();
  const msg=compose(ctx,text,paths);
  const r=await act('chat_to',{text:msg,to});
  if(!r.ok)return;
  histAdd(key,text);HI.i=null;  // B120: Up brings it back
  store.set(DRAFT_KEY(key),'');if(ta)ta.value='';
  S.atts=[];S.ctx=null;
  const len=feedOf(to).length;
  S.sent[to]={at:Date.now(),len,pending:[...((S.sent[to]&&S.sent[to].pending)||[]),msg]};
  if(S.thread!==to)open(to);else render(true);
}
function about(a){
  const [k,v]=[a.split(':')[0],a.slice(a.indexOf(':')+1)];
  if(a==='new')S.ctx={kind:'new',label:'A new task'};
  else if(k==='need'){const n=S.snap.needs[+v];if(!n)return;S.ctx={kind:'need',id:n.id,title:n.title,label:`${n.id}: ${n.ask||n.title}`}}
  else if(k==='concept'){const c=S.snap.concepts[+v];if(!c)return;S.ctx={kind:'concept',id:c.concept||c.id,title:c.title,label:c.title||c.concept}}
  else if(k==='plan'){const q=S.snap.queue.find(x=>x.id===v);if(!q)return;S.ctx={kind:'plan',id:q.id,title:q.title,label:`${q.id} ${q.title}`}}
  open('c1');
}
async function upload(file){
  const it={name:file.name||'file'};S.atts.push(it);
  if((file.type||'').startsWith('image/')){const r=new FileReader();r.onload=()=>{it.thumb=r.result;render(true)};r.readAsDataURL(file)}
  render(true);
  try{const r=await fetch(tq('upload?name='+encodeURIComponent(it.name)),{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
    const j=await r.json();if(j.ok)it.path=j.path;else{it.err=j.out||'upload failed';toast(it.err,true)}}
  catch(e){it.err=String(e);toast(`Upload failed: ${e}`,true)}
  render(true);
}

document.addEventListener('click',async e=>{
  const q=s=>e.target.closest(s);let x;
  if(S.undo&&!q('[data-undo]'))finalDelete();  // F118: any other click makes the delete final
  if(x=q('[data-slashpick]')){slashTake(+x.dataset.slashpick);return}  // B119
  if(slashOpen()&&!q('[data-in]'))slashClose();
  if(q('[data-undo]')){S.undo=null;render(true);return}
  if(x=q('[data-del]')){S.undo={names:[x.dataset.del],bar:false};S.sel=[];render(true);return}
  if(q('[data-delsel]')){if(S.sel.length){S.undo={names:S.sel,bar:true};S.sel=[]}render(true);return}
  if((x=q('[data-thread]'))&&/^c\d+$/.test(x.dataset.thread)){  // F118: Ctrl/Cmd+click picks, Shift+click a range
    const how=e.shiftKey?'range':e.ctrlKey||e.metaKey?'toggle':'';
    const p=chatPick(chats().map(c=>c.name),S.sel,S.selLast,x.dataset.thread,how);S.sel=p.sel;S.selLast=p.last;
    if(how){e.preventDefault();render(true);return}
  }
  if(x=q('[data-viewsw]')){try{localStorage.setItem(VIEW_KEY,x.dataset.viewsw)}catch(err){}return}  // F81: the link goes on
  if(q('[data-mic]'))return listen();  // F93
  if(q('[data-menu]')){S.drawer=true;render();return}
  if(q('#scrim')){S.drawer=false;render();return}
  if(x=q('[data-view]'))return goView(x.dataset.view);
  if(q('[data-home]')){S.thread=null;S.ctx=null;render(true);return}
  if(q('[data-slots-n]'))return;
  if(q('[data-unsure]')){S.sure=null;render(true);return}
  if(x=q('[data-ctl]')){const c=controlOf(x.dataset.ctl);if(!c)return;
    const n=c.needs==='n'?(document.querySelector('[data-slots-n]')||{}).value||'':'';
    const rq=controlClick(c,{n,tid:x.dataset.tid,sure:x.hasAttribute('data-sure')});
    if(rq.ask){S.sure=c.key;render(true);return}  // F82: asked in the page, no browser dialog
    if(c.needs==='n'&&!/^\d+$/.test(n.trim()))return toast('Type how many slots first',true);
    S.sure=null;x.disabled=true;
    const r=await act(rq.name,rq.args);if(r.ok){S.slotsN='';toast(String(r.out||'').split('\n')[0]||`${c.label}: done`)}
    render(true);return}
  if(x=q('[data-thread]')){S.ctx=null;return open(x.dataset.thread)}
  if(q('[data-new]')){S.drawer=false;S.waitNew={known:chats().map(c=>c.name),at:Date.now()};render();
    const r=await act('new_control',{});if(r.ok)toast('Starting a new chat: it opens here once it is up');else S.waitNew=null;return}
  if(x=q('[data-cchat]')){const c=S.snap.concepts[+x.dataset.cchat];if(!c)return;x.disabled=true;  // F86
    S.waitNew={known:chats().map(c=>c.name),at:Date.now()};
    const r=await act('concept_chat',{cid:c.concept||c.id,title:c.title||'',url:c.url||'',copy:c.copy||''});
    if(r.ok)toast(`Starting a new chat about ${c.concept||c.id}: it opens here once it is up`);else{S.waitNew=null;x.disabled=false}return}
  if(x=q('[data-ans]')){const n=S.snap.needs[+x.dataset.ans];if(!n)return;x.disabled=true;
    const r=await act('answer',{tid:n.id,text:x.dataset.v});if(r.ok)toast(`Sent: ${n.id} ${x.dataset.v}`);return}
  if(x=q('[data-later]')){const n=S.snap.needs[+x.dataset.later];if(!n)return;x.disabled=true;
    const r=await act('shelve',{tid:n.id});if(r.ok)toast(`${n.id} is set aside until you bring it back`);return}
  if(x=q('[data-unpark]')){const id=x.dataset.unpark;x.disabled=true;  // B118
    const r=await act('unpark',{tid:id});if(r.ok)toast(`${id} is unparked: it joins Follow-ups`);else x.disabled=false;return}
  if(q('[data-kadd]')){S.kOpen=!S.kOpen;S.kFocus=S.kOpen;S.kSaid='';render(true);return}  // F87: the Concepts view's +
  if(q('[data-kcancel]')){S.kOpen=false;render(true);return}
  if(x=q('[data-about]'))return about(x.dataset.about);
  if(x=q('[data-quick]')){const r=await act('quick_ask',{key:x.dataset.quick});if(r.ok){S.ctx=null;S.sent.c1={at:Date.now(),len:feedOf('c1').length,pending:[]};open('c1')}return}
  if(x=q('[data-pick]')){const c=S.snap.concepts[+x.dataset.pick],o=c&&(c.options||[])[+x.dataset.o];if(!o)return;
    const r=await act('answer',{tid:c.id,text:`go with ${o.name}`});if(r.ok){toast(`Going with ${o.name}`);open('c1')}return}
  if(x=q('[data-rel]')){const now=x.dataset.rel==='now';x.disabled=true;
    const r=await act('release',{now});if(r.ok)toast(now?'Releasing what has landed now':'The release waits for the running tasks to land');return}
  if(x=q('[data-steps]')){S.openSteps[x.dataset.steps]=!S.openSteps[x.dataset.steps];render(true);return}
  if(q('[data-unctx]')){S.ctx=null;render(true);return}
  if(x=q('[data-unatt]')){S.atts.splice(+x.dataset.unatt,1);render(true);return}
  if(q('[data-clip]')){$('file').click();return}
  if(x=q('[data-stop]')){const n=x.dataset.stop||S.thread;if(n)act('interrupt',{session:n});return}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.matches('[data-kform]'))newConcept();else send()});
function selectedText(t){
  if(t&&typeof t.selectionStart==='number'&&t.selectionEnd>t.selectionStart)return true;
  return !!String(window.getSelection&&window.getSelection()||'');
}
document.addEventListener('keydown',e=>{
  /* B116: Ctrl+C interrupts the open chat while it works (not while text is selected, so copying still works);
     B120: in the message box Esc closes the menu, then interrupts a working chat (never goes back), else leaves
     the box; out of the box Esc never interrupts, it goes back */
  if(e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key==='c'||e.key==='C')&&S.thread&&busy(S.thread)&&!selectedText(e.target)){e.preventDefault();act('interrupt',{session:S.thread});return}
  if(e.target.matches&&e.target.matches('[data-kin]')){  // F87: Enter queues the concept, Esc closes the box
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();newConcept();return}
    if(e.key==='Escape'){e.preventDefault();S.kOpen=false;render(true);return}
    return}
  if(e.target.matches&&e.target.matches('[data-in]')){
    if(slashOpen()&&!e.isComposing){  // B119: arrows move, Enter or Tab picks, Esc closes the menu and stays in the box
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SL.i=slashMove(SL.i,SL.items.length,e.key);slashShow(e.target);return}
      if(e.key==='Escape'){e.preventDefault();slashClose();return}
      const c=SL.items[SL.i];
      if(e.key==='Tab'||(e.key==='Enter'&&!e.shiftKey&&c&&e.target.value.trim()!=='/'+c.name)){e.preventDefault();slashTake(SL.i);return}
      if(e.key==='Enter')slashClose();  // the command is typed in full: Enter sends it
    }
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();return}
    if((e.key==='ArrowUp'||e.key==='ArrowDown')&&histKey(e,e.target)){e.preventDefault();return}  // B120: earlier messages
    if(e.key==='Escape'&&S.thread&&busy(S.thread)){e.preventDefault();act('interrupt',{session:S.thread});return}  // B120
    if(e.key==='Escape'){e.preventDefault();e.target.blur();return}
    return}
  if(e.key==='Escape'&&S.sel.length){S.sel=[];render(true);return}  // F118
  if(e.key==='Escape'&&S.drawer){S.drawer=false;render();return}
  if(e.key==='Escape'&&S.thread&&!(e.target.matches&&e.target.matches('input,textarea,select'))){S.thread=null;S.ctx=null;render(true);return}  /* out of the box, Esc goes back */
  const c=e.target.closest&&e.target.closest('.card.tap');if(c&&c===e.target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-slots-n]'))S.slotsN=e.target.value;if(e.target.matches('[data-kin]'))S.kText=e.target.value;if(e.target.matches('[data-in]')){grow(e.target);store.set(DRAFT_KEY(boxKey()),e.target.value);HI.i=null;slashShow(e.target)}});
document.addEventListener('paste',e=>{if(!e.target.matches||!e.target.matches('[data-in]'))return;
  const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();fs.forEach(upload)}});
$('file').addEventListener('change',e=>{[...e.target.files].forEach(upload);e.target.value=''});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();[...e.dataTransfer.files].forEach(upload)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.thread)loadFeed(S.thread)});
addEventListener('pagehide',finalDelete);  // F118: leaving the page makes a pending delete final

render(true);
connect();
loadFeed('c1');
</script>
</body>
</html>
