/* Style rules: docs/STYLE.md. Read it before you change how this page looks, moves or speaks, and follow it;

/* F79: the run app, a calm chat app over F74's model (the snapshot, the feeds, the actions). Warm off-white

   box. It switches layout by its own width (container query): a sidebar on a desktop, a drawer on a phone. */
:root{
  --page:var(--bg); --bg:#faf9f5; --side:#f5f4ee; --surface:#ffffff; --bubble:#f0eee6; --fg:#141413; --muted:#73726c; --faint:#a3a199;
  --line:#e8e6dc; --line2:#dcd9cd; --accent:#c96442; --accent2:#b5573a; --onaccent:#ffffff; --ok:#4f7a43;
  --warn:#a8711a; --bad:#b0412e; --onbad:#ffffff; --scrim:rgba(0,0,0,.25); --shadow:rgba(0,0,0,.15); --lift:rgba(0,0,0,.04); --feed:#1f1e1d;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:11px; --fs-s:12px; --fs-m:13px; --fs-n:14px; --fs-b:15px; --fs-l:17px; --fs-xl:30px;
  --r-xs:4px; --r-s:8px; --r-m:10px; --r-l:16px; --r-xl:20px; --r-full:99px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --tap:44px;
  --dur-fast:150ms; --dur:200ms; --dur-slow:250ms; --ease:cubic-bezier(.2,.8,.2,1); --pulse:1.6s;
  --dur-spring:450ms; --spring:cubic-bezier(.3,1.35,.5,1); --spring-soft:cubic-bezier(.2,.9,.25,1);
}
@supports (transition-timing-function:linear(0,1)){:root{  /* damping .7 (overshoots 4%) and 1 */
  --spring:linear(0,.069,.226,.412,.591,.744,.862,.946,1,1.03,1.044,1.046,1.041,1.033,1.025,1.017,1.01,1.005,1.002,.999,.998,.998,.998,.998,1);
  --spring-soft:linear(0,.057,.179,.319,.453,.571,.669,.748,.811,.859,.895,.923,.944,.959,.97,.979,.985,.989,.992,.994,.996,.997,.998,.999,1)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --onbad:#262624; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); --lift:rgba(0,0,0,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --onbad:#262624; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); --lift:rgba(0,0,0,.12); color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:none} *::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
/* B160: --page is what shows outside .app (behind Safari's bar, round the keyboard): the colour of the view, a chat's too */
:root.term{--page:var(--t-bg)} :root.lightfeed{--feed:#ffffff} :root.pagefeed{--feed:var(--bg)}  /* session_frame.THEMES' grounds; a themed session's is the page's */
html,body{height:100%;overscroll-behavior:none;overflow:hidden;background:var(--page)}
body{position:fixed;inset:0;margin:0;color:var(--fg);font:15px/1.5 var(--sans)}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.edge{position:fixed;left:0;right:0;height:8px;background:var(--page);z-index:3;pointer-events:none} .edge-top{top:0} .edge-bottom{bottom:0}
.app{position:relative;container-type:inline-size;height:100vh;height:100dvh;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* B160: the keyboard is open: kbFit() sets .app's top and height from visualViewport, and nothing pans the page */
.app.kb{position:fixed;left:0;right:0;container-type:size;padding-bottom:0}
.app.kb .dock{padding-bottom:8px} .app.kb .sheet{padding-bottom:12px;box-shadow:0 100px 0 var(--surface)} .app.kb .slash{max-height:min(320px,50cqh)}
.app.kb .top,.app.kb .dock,.app.kb .scrim{touch-action:pinch-zoom}
.shell{flex:1;min-height:0;min-width:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr)}

/* the sidebar: a drawer on a phone */
.side{position:absolute;inset:0 auto 0 0;width:280px;max-width:85%;background:var(--side);border-right:1px solid var(--line);z-index:6;
  transform:translateX(-102%);transition:transform var(--dur-spring) var(--spring-soft),visibility var(--dur-spring);display:flex;flex-direction:column;overflow:hidden auto;touch-action:pan-y pinch-zoom}
/* F150: the sidebar's two levels: a project's own, and All projects, which slides in over it from the left and back out.
   .sghost: the level that was there, for the length of the slide */
.sidein{position:relative;flex:1 0 auto;display:flex;flex-direction:column;background:var(--side);padding:12px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.sghost{position:absolute;left:0;right:0;min-height:100%;pointer-events:none}
.side.up #sidein,.sghost.out{z-index:1}
.side.up #sidein{animation:listin var(--dur-slow) var(--ease)} .sghost.out{animation:listout var(--dur-slow) var(--ease) forwards}
.side.open{transform:none;box-shadow:8px 0 30px var(--shadow)}
.side:not(.open):not(.drag){visibility:hidden}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5;opacity:0;visibility:hidden;touch-action:pan-y pinch-zoom;transition:opacity var(--dur-slow) var(--ease),visibility var(--dur-slow)}
.scrim.on{opacity:1;visibility:visible}
.side.drag,.sheet.drag,.scrim.drag{transition:none} .sheet.drag,.scrim.drag{visibility:visible}  /* also while it settles (springRun) */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;color:inherit;text-decoration:none}
.logo{width:28px;height:28px;border-radius:var(--r-s);background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font:600 13px var(--serif);flex:none}
.brand b{font:500 17px var(--serif)}
.nav{display:grid;gap:1px;margin-top:6px}
.ni{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:var(--r-m);padding:8px 10px;cursor:pointer;text-align:left;color:var(--fg)}
.ni:hover{background:var(--bubble)} .ni.on{background:var(--bubble);font-weight:500}
.ni .n{margin-left:auto;font-size:var(--fs-s);background:var(--accent);color:var(--onaccent);border-radius:var(--r-full);padding:0 7px}
.shead{font-size:var(--fs-s);color:var(--muted);padding:14px 10px 4px}
.shead.row{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.shadd{height:28px;border:0;border-radius:var(--r-s);padding:0 8px;background:none;color:var(--accent);font-size:var(--fs-m);font-weight:500;display:flex;align-items:center;gap:4px;cursor:pointer;flex:none}
.shadd:hover{background:var(--bubble)} .shadd svg{width:14px;height:14px;stroke-width:2.2}
.thread{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:var(--r-m);padding:7px 10px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font-size:var(--fs-n)}
.thread:hover{background:var(--bubble)} .thread.on{background:var(--bubble)}
.thread .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .off{width:7px;height:7px;border-radius:50%;border:1px solid var(--faint);flex:none}
/* F118: a chat row's delete button (on hover; always on touch), its Undo, the selection and its Delete N bar */
.crow{position:relative} .crow .thread{padding-right:38px}
.crow .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:28px;min-width:28px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;font-size:var(--fs-s);font-weight:500}
.crow:hover .del,.crow:focus-within .del,.crow .del.undo{opacity:1} .crow .del:hover{background:var(--line2);color:var(--fg)}
.crow .del svg{width:15px;height:15px} .crow .del.undo{padding:0 8px;color:var(--accent)}
@media (hover:none){.crow .del{opacity:1}}
/* F133: the pin button beside delete (always shown on a pinned chat), and a row being dragged */
.crow[data-crow] .thread{padding-right:68px}
.crow .pin{position:absolute;right:34px;top:50%;transform:translateY(-50%);height:28px;width:28px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0}
.crow:hover .pin,.crow:focus-within .pin,.crow .pin.on{opacity:1} .crow .pin.on{color:var(--accent)} .crow .pin:hover{background:var(--line2);color:var(--fg)}
.crow .pin svg{width:15px;height:15px}
@media (hover:none){.crow .pin{opacity:1}}
.crow[data-crow]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.crow.lift,.crow.drag{background:var(--line2);border-radius:var(--r-m)} .crow.drag{position:relative;z-index:5;box-shadow:0 4px 14px var(--shadow);opacity:.95}
.thread.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.thread.gone{opacity:.5;cursor:default} .thread.gone .t{text-decoration:line-through}
.selbar{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:var(--fs-m);color:var(--muted)} .selbar span{flex:1}
.selbar .btn{padding:4px 10px;font-size:var(--fs-m)}
.none{font-size:var(--fs-m);color:var(--faint);padding:4px 10px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse var(--pulse) infinite}
@keyframes pulse{50%{opacity:.35}}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 4px;border-top:1px solid var(--line);font-size:var(--fs-m);color:var(--muted)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 12px var(--sans);flex:none}
.me .sub{font-size:var(--fs-xs)}
/* F150: All projects at the top of the sidebar (through Runner Home), and its list: one row per project */
.slevel{font:500 17px var(--serif);padding:8px 10px 2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.allp{width:100%} .ni.allp svg{color:var(--muted)} .plist{display:grid;gap:1px} .plist .qline{padding-inline:10px}
.prow{display:flex;align-items:center;gap:8px;border-radius:var(--r-m);padding:7px 10px;text-decoration:none;color:var(--fg);font-size:var(--fs-n)}
.prow:hover{background:var(--bubble)} .prow.on{background:var(--bubble);font-weight:500}
.prow.off{color:var(--muted)} .prow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .prow .st{font-size:var(--fs-s);color:var(--muted)}
.prow .n{font-size:var(--fs-s);background:var(--accent);color:var(--onaccent);border-radius:var(--r-full);padding:0 7px}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;background:none;border:1.5px solid var(--muted)} .pdot.running{background:var(--ok);border-color:var(--ok)} .pdot.idle{background:var(--warn);border-color:var(--warn)}
.pcard .row{gap:var(--s2)} .pcard .btn{flex:none} .pcard a.pname{color:inherit;text-decoration:none;font-weight:600} .pcard.off{padding-block:8px} .pcard.off a.pname{font-weight:500;color:var(--muted)}
.pcard .ell{min-width:0} .ptasks{display:grid;gap:2px;min-width:0}
.top .plus{flex:none;padding:6px 12px} .top .plus svg{width:15px;height:15px;stroke-width:2.2}
.meter{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--fs-m)}
.meter .bar{height:6px;background:var(--line);border-radius:var(--r-xs);overflow:hidden} .meter .bar i{display:block;height:100%;background:var(--ok)}
.meter .bar i.w{background:var(--warn)} .meter .bar i.b{background:var(--bad)} .meter .r{color:var(--muted)}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}

/* the main column */
.main{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;touch-action:pan-y pinch-zoom}
.top{position:relative;z-index:3;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 10px 6px;padding-right:max(10px,env(safe-area-inset-right,0px))}
.icon{width:36px;height:36px;border-radius:var(--r-m);border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.icon:hover{background:var(--bubble)}
.top .title{flex:1;min-width:0;text-align:center;font-weight:500;font-size:var(--fs-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{position:relative;flex:1;overflow:auto;min-height:0;overflow-anchor:none;overscroll-behavior:contain}
.col{max-width:720px;margin:0 auto;padding:6px 16px 24px;display:grid;gap:12px}
.greet{font:400 30px/1.2 var(--serif);text-align:center;margin:18px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px}
.greet .logo{width:30px;height:30px;font-size:var(--fs-b)}
.sec{font-size:var(--fs-m);color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.sec .ln{flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:grid;gap:10px;min-width:0}
.card.tap{cursor:pointer} .card.tap:hover{border-color:var(--line2)}
.card.need{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.q{font:500 17px/1.35 var(--serif);overflow-wrap:anywhere}
/* F162: a Needs you card's words: one button, what is wanted, the title, at most two lines of what to do */
.asktap{display:grid;gap:var(--s1);width:100%;min-width:0;min-height:var(--tap);border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.asktap b{font:500 17px/1.35 var(--serif)} .asklab{color:var(--warn);font-weight:600;font-size:var(--fs-m)}
.askdo{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.small{font-size:var(--fs-m);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{width:34px;height:34px;border-radius:var(--r-m);background:var(--bubble);display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted);flex:none}
.status{font-size:var(--fs-s);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.quote{font:400 15px/1.45 var(--serif);color:var(--fg);border-left:2px solid var(--line2);padding-left:10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-m);padding:7px 14px;font-weight:500;font-size:var(--fs-n);cursor:pointer;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bubble)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.acc{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.card.relph{opacity:.6}
.btn.busy{opacity:.7;cursor:progress}
.btn.bad{background:var(--bad);color:var(--onbad);border-color:var(--bad)}
.sure{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.slotsn{display:inline-flex;gap:6px;align-items:center}
.slotsn input{width:64px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:var(--r-m);padding:7px 8px;font:16px/1.35 var(--sans)}
.chev{color:var(--faint);display:grid}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:7px 12px;font-size:var(--fs-m);cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.chip svg{width:15px;height:15px;color:var(--muted)}
.chip:hover{background:var(--bubble)}
.chip[data-view]{position:relative}  /* F164: Talk is 44px to press with any pointer, and looks like the chips beside it */
.chip[data-view]::after{content:'';position:absolute;left:0;right:0;top:50%;height:var(--tap);transform:translateY(-50%)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:4px 2px;min-width:0}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bubble);color:var(--muted)}
.ev .ic svg{width:14px;height:14px}
.ev .ic.ok{color:var(--ok)} .ev .ic.bad{color:var(--bad)} .ev .ic.go{color:var(--accent)}
.ev .txt{min-width:0;overflow-wrap:anywhere}

/* the message box */
.box{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-xl);padding:12px 12px 10px 16px;display:grid;gap:8px;box-shadow:0 2px 10px var(--lift);margin:0}
.box:focus-within{border-color:var(--faint)}
.box textarea{border:0;outline:0;resize:none;background:none;font:16px/1.45 var(--sans);color:var(--fg);min-height:26px;max-height:160px;padding:2px 0;width:100%}
.box textarea::placeholder{color:var(--faint)}
.boxrow{display:flex;align-items:center;gap:6px}
.tool{height:32px;min-width:32px;border-radius:var(--r-s);border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;cursor:pointer;color:var(--muted);font-size:var(--fs-m)}
.tool:hover{background:var(--bubble);color:var(--fg)}

.send.stop{background:var(--fg);color:var(--bg)} .send.stop+.send{margin-left:0}
.send:disabled{opacity:.4;cursor:default}
.send svg{stroke-width:2.2}
.x{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 4px}
.atts{display:flex;gap:8px;flex-wrap:wrap}
.att{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);padding:6px 10px 6px 6px;font-size:var(--fs-s);background:var(--bg);max-width:220px}
.att span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.att img,.att .fi{width:34px;height:34px;border-radius:var(--r-s);object-fit:cover;background:var(--bubble);display:grid;place-items:center;flex:none}
.att.up{opacity:.55} .att.err{border-color:var(--bad)}
.att .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:var(--fs-xs);line-height:1;padding:0}
.dock{padding:8px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .box{max-width:720px;margin:0 auto}
/* F114: a chat or slot: the real session (ttyd's page, #feed) fills the space above the message box. On a touch device

<body>
<div class="app" id="app">
  <div class="shell">
    <div class="scrim" id="scrim"></div>

    <section class="main">

      <div class="notices"><div class="offline" id="offline" role="status" hidden>Lost the run page's connection: trying again…</div>
      <div class="obbar" id="obbar" hidden></div>
      <div class="news" id="news" role="status" hidden></div></div>
      <div class="body" id="body"></div>
      <div class="feed" id="feed" hidden><div id="feedframe"></div><div class="feedtouch" id="feedtouch"></div><div class="feedsay" id="feedsay" role="status" hidden></div></div>
      <div class="dockwrap"><div class="dock" id="dock"></div><div class="slimbox" id="slimbox" hidden></div></div>
    </section>
    <div class="scrim sheetscrim" id="sheetscrim"></div>

  <input type="file" multiple hidden id="file">

<div class="toast" id="toast" role="status" hidden></div>
<div class="obpop" id="obpop" hidden></div>
<div class="cview" id="cview" role="dialog" aria-label="Concept" hidden></div>

<script id="logic">
/* The page's pure parts, run in node by tests/test_web.py: no DOM here. */

/* F162: a Needs you card and its popup: what they say is the row's own (ui_model's detail); a run without it has the ask */

function needD(n){const ask=n.ask||n.title||n.what||'';
  return n.detail||{said:'Needs you',title:n.title||n.id,where:'',summary:n.ask_short||ask,lead:[],steps:[ask],expect:[],notes:[],shots:[]}}

  return `<button class="asktap" data-needopen="${E_(n.id)}" aria-haspopup="dialog"><span class="asklab">${E_(needLab(n))}</span><b class="ell">${E_(d.title)}</b><span class="askdo">${askWords(d.summary)}</span><span class="small">${['Press for details',k>1?`${k} steps`:'',E_(n.id),E_(n.age||'')].filter(Boolean).join(' · ')}</span></button>`}
/* F175a: a step's link to open and its command to copy */
function stepMore(m,j){if(!m)return '';
  return (/^https?:/i.test(m.link||'')?`<div class="btns"><a class="btn" href="${E_(m.link)}" target="_blank" rel="noopener noreferrer">Open</a></div>`:'')
    +(m.cmd?`<div class="small">Run on ${E_(m.on||'this machine')}</div><pre class="out" data-stepcmd="${j}"><code>${E_(m.cmd)}</code></pre><div class="btns"><button class="btn" data-stepcopy="${j}">Copy</button></div>`:'')}
/* F175a: the inputs of a Needs you item, a field each; o: secure (a secret may be sent from this page), field and out
   (the input that was refused, and why). No value is in the markup: keepFields() puts it back */
const needInputs=n=>needD(n).inputs||[];
const giveField=(id,x)=>`${x.kind==='secret'?'givesec':'give'}:${id}:${x.key}`;
const GIVE_HTTP='No secret is taken here: this page came over plain http, where others on the network could read it. Open its https link (run status prints it when Tailscale Serve gives one), or open the page on the machine the run is on.';
function giveHTML(n,o){const xs=needInputs(n);
  return xs.length?`<section><h3>What to enter</h3>${xs.map((x,j)=>{
    if(x.kind==='secret'&&!o.secure)return `<div class="give"><span>${E_(x.label)}</span><div class="small v-bad">${GIVE_HTTP}</div></div>`;
    const bad=o.field===x.key;
    return `<label class="give"><span>${E_(x.label)}</span><input class="fld" data-f="${E_(giveField(n.id,x))}" ${x.kind==='secret'?'type="password" autocomplete="new-password"':`type="text"${x.kind==='link'?' inputmode="url"':''} autocomplete="off"`} autocapitalize="off" autocorrect="off" spellcheck="false"${bad?` aria-invalid="true" aria-describedby="giveout${j}"`:''}>${bad?`<span class="small v-bad" id="giveout${j}" role="alert">${E_(o.out)}</span>`:''}</label>`}).join('')}${o.done||''}</section>`:''}

function needBody(n,url,give=''){const d=needD(n), more=d.step_more||[], list=(t,h,xs)=>xs.length?`<section><h3>${h}</h3><${t}>${xs.map((x,j)=>`<li>${askWords(x)}${t==='ol'?stepMore(more[j],j):''}</li>`).join('')}</${t}></section>`:'';
  return d.lead.map(x=>`<p>${askWords(x)}</p>`).join('')+list('ol','What to do',d.steps)+list('ul','What you should see',d.expect)+give
    +d.notes.filter(x=>!needInputs(n).length||!/^Reply (done once it is|yes\/no)$/i.test(x)).map(x=>`<p class="small">${askWords(x)}</p>`).join('')
    +(d.shots.length?`<section><h3>Pictures</h3><div class="shots">${d.shots.map((s,j)=>`<button class="shot" data-shot="${j}" aria-label="Open the picture: ${E_(s.caption||'no caption')}"><img src="${E_(url(s))}" alt="${E_(s.caption||'Picture')}" loading="lazy"></button>`).join('')}</div></section>`:'')}
/* a task's text as paragraphs: its fields, notes, block and numbered parts each on their own */
function taskParas(text){return String(text||'').split(/\n+|(?= \| )|(?= — )|(?= BLOCKED: )|(?=\s\(?\d\)\s)/).map(x=>x.trim()).filter(Boolean)}
/* whose reply box has a button of its own: nothing else answers it, or the answers take no words with them */
function needReplies(n){return n.label!=='TOOL'&&!needInputs(n).length&&(!answerOpts(n).length||['DECIDE','STUCK','PITCH'].includes(n.label))}

/* what the toast says once an answer button's command ran: the run's own words ('R13 ticked'), else the reply */
function answerSaid(r,id,v){return(r&&r.said)||(r&&r.gone?`${id}: ${v}`:`Sent to a new chat: ${id} ${v}`)}
/* F93: Talk's words: a session's feed entries as a conversation, yours {w:'u'} and the replies {w:'a'}; k, its entry's id */
function talkMsgs(entries){return(entries||[]).filter(e=>e.kind==='you'||e.kind==='say').map(e=>({w:e.kind==='you'?'u':'a',text:e.text,...(e.id?{k:e.id}:{})}))}
/* F114: what a chat or slot shows. o: stand (a chat still starting, '@cid'), starting (its first message went), info

  if(o.stand)return'starting';
  const i=o.info;
  if(i&&i.ok)return'session';
  if(i&&i.mode==='install')return'install';
  if(o.starting)return'starting';
  if(!i)return'loading';
  return i.live?'none':o.chat?'ended':'idle';

/* the key row: a key's bytes, as the terminal sends them (app: application cursor keys) */
const FEED_KEYS=[['esc','Esc'],['tab','Tab'],['up','↑'],['enter','Enter'],['ctrlc','Ctrl-C'],['left','←'],['down','↓'],['right','→']];
function feedBytes(k,app){const c=app?'\x1bO':'\x1b[';
  return{esc:'\x1b',tab:'\t',enter:'\r',ctrlc:'\x03',up:c+'A',down:c+'B',right:c+'C',left:c+'D'}[k]||''}

function feedWords(lines){return lines.map(l=>l.replace(/\s+$/,'')).join('\n').replace(/\n+$/,'')}
/* F170: the lines at the bottom of the agent's window, from the screen's lines (top to bottom, no trailing spaces); dim(y,x):
   is that cell dim (a hint, not typed)? lit(y,x): has it a ground of its own? null when the prompt is not there as the agent CLI draws it (a menu, a question, a new
   look): then nothing is hidden. {top, end: rows, the first hidden and the last of the box; text: unsent words in the
   prompt; bash; mode: FEED_MODES' key; shells, agents: how many; update: its command, '…' when cut off; status: the status
   line; rate: a 1: 2: 3: survey stands above it, answered by a digit; work: does it work; jump: is it scrolled up} */
const FEED_MODES=[['default','Ask first','manual mode|default mode'],['acceptEdits','Accept edits','accept edits'],['plan','Plan','plan mode'],['auto','Auto','auto mode'],['bypassPermissions','Bypass permissions','bypass permissions']];

// cells of a line's words as the agent CLI counts them: 2 for a wide letter or an emoji, marks and joined parts with it
const feedSeg=new Intl.Segmenter(undefined,{granularity:'grapheme'});
const feedCells=l=>[...feedSeg.segment(l)].reduce((n,{segment:c})=>n+(/[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe6f\uff00-\uff60\uffe0-\uffe6]|\p{Emoji_Presentation}|\p{RI}|\ufe0f/u.test(c)?2:1),0);
// B194: the rule over the prompt with a session name on it: on a narrow window mostly the name, cut with no dashes before
// it when it is long (' agent-runner · F149 · pa… ─'); as wide as the rule under the prompt (cols), its > on the next line
const feedNamed=(l,next,cols)=>/^[─━]* \S.* [─━]+$/.test(l)&&Math.abs(feedCells(l)-cols)<=1&&/^[❯!>](\s|$)/.test(next||'');

const FEED_PILL=/ (?:Jump to bottom|\d+ new messages?|Waiting for your answer)(?: \([^)]*\))?(?: ↓| · \S+ to scroll)(?: |$)/g;
const FEED_JUMP=/(Jump to bottom|\d+ new messages?|Waiting for your answer)( \(.*\))?( ↓| · .* to scroll)\s*$/;

const feedJump=(l,cols,lit)=>FEED_JUMP.test(l)||[...l.matchAll(FEED_PILL)].some(m=>Math.abs(feedCells(l.slice(0,m.index))-(cols-feedCells(m[0].trim())-2)/2)<1&&(!lit||lit(feedCells(l.slice(0,m.index))+2)));

  const note=lines[at-1]||'';
  if(/^\s+Update available/.test(note)||/^\s{12,}\S/.test(note)&&!/Jump to bottom/.test(note)&&!feedJump(note,cols,lit&&(x=>lit(at-1,x)))&&/ · |Update available|\/effort|ctrl\+/.test(note))top=at-1;
  const foot=(top<at?[note]:[]).concat(below), all=foot.join('\n'), num=re=>{const m=re.exec(all);return m?+m[1]:0};
  const m=/Update available(?: · run |! Run: | · Run: )(.+?)\s*$/m.exec(all);
  const mode=FEED_MODES.find(x=>new RegExp('[⏵⏸][^\\n]*\\b(?:'+x[2]+')','i').test(all)||new RegExp('^\\s*(?:'+x[2]+') on','im').test(all));

/* --- a little markdown for replies: code blocks, inline code, bold, links, lists, headings ------------------ */
function md(src){
  const parts=String(src||'').split(/```[^\n]*\n?/);let h='';
  parts.forEach((p,i)=>{
    if(i%2){h+=`<pre><code>${esc(p.replace(/\n$/,''))}</code></pre>`;return}
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    for(const block of p.split(/\n{2,}/)){
      const b=block.trim();if(!b)continue;const ls=b.split('\n');
      if(ls.every(l=>/^\s*[-*] /.test(l)))h+='<ul>'+ls.map(l=>`<li>${inline(l.replace(/^\s*[-*] /,''))}</li>`).join('')+'</ul>';
      else if(ls.every(l=>/^\s*\d+[.)] /.test(l)))h+='<ol>'+ls.map(l=>`<li>${inline(l.replace(/^\s*\d+[.)] /,''))}</li>`).join('')+'</ol>';
      else if(/^#{1,4} /.test(b)&&ls.length===1)h+=`<h3>${inline(b.replace(/^#+ /,''))}</h3>`;
      else h+=`<p>${ls.map(inline).join('<br>')}</p>`;
    }
  });
  return h;
}

    const more=on&&t.more;
    if(more){t.more=t.stopped=false;t.tries=t.fails=0}
    micFree(rec);
    if(again)log('still held: starts again');
    if(more||(again&&t.ms>=1000))micWhenFree(()=>hear(t));
    else if(again||retry)setTimeout(()=>{if(TK.ear===t)micWhenFree(()=>hear(t))},MIC_RETRY);
    else earEnd(t);
  };

  try{rec.start();cut()}catch(e){cut();log(`start failed: ${e.message||e}`);TK.report=t.trail;TK.ear=null;TK.rec=null;TK.state='';toast(`The mic could not start: ${e.message||e}`,true);render(true);micFree(rec);soundAs('playback');if(t.words)talkSend(t.words)}
}

  if(t.tries&&!(t.mode==='auto'&&(!t.err||t.err==='no-speech')))TK.report=t.trail;  // the Copy mic report button
  TK.note=t.mode==='auto'&&t.err!=='aborted'?(TS.mic==='hold'?'Hold to talk':'Tap to talk'):t.tries?heardNothing(t.err,t.mode,t.ms,t.tries,t.stopped,t.was,t.msg):'';

  es.onerror=()=>{if(!lost)lost=setTimeout(()=>{$('offline').hidden=false},8000)};

document.addEventListener('touchstart',e=>{
  if(SW&&SW.on&&!SW.sheet){if(e.touches.length>1)return;swipeEnd(false)}  // B167: a second finger does not end the lock
  SW=null;const t=e.touches[0], el=e.target;
  if(e.touches.length!==1||!el.closest||el.closest('input,textarea,select,[contenteditable],iframe,.obpop,.cview,.mic.hold')||DR&&DR.on)return;
  if(S.sheet){if(el.closest('#sheet')&&$('sheet').scrollTop<=0)SW={sheet:true,x:t.clientX,y:t.clientY,at:e.timeStamp,d:0,on:false,ly:t.clientY,lt:e.timeStamp,v:0,base:0};return}
  if(!drawerOn()||el.closest('#body,#dock')&&sideways(el))return;
  SW={x:t.clientX,y:t.clientY,at:e.timeStamp,d:0,on:false,open:S.drawer,w:$('side').offsetWidth||280,lx:t.clientX,lt:e.timeStamp,v:0,id:t.identifier,scr:scrollers(el)};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW)return;
  const t=SW.on&&[...e.touches].find(f=>f.identifier===SW.id)||e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(DR&&DR.ready&&DR.hold){if(SW.on)swipeEnd(false);SW=null;return}  // the row is held: it is being dragged
  if(SW.sheet){
    if(!SW.on){if(Math.abs(dy)<10&&Math.abs(dx)<10)return;if(dy<Math.abs(dx)||$('sheet').scrollTop>0){SW=null;return}SW.on=true;SW.base=Math.max(0,grab($('sheet'),'m42',0));$('sheet').classList.add('drag')}
    if(e.timeStamp>SW.lt){SW.v=(t.clientY-SW.ly)/(e.timeStamp-SW.lt);SW.ly=t.clientY;SW.lt=e.timeStamp}
    SW.d=Math.max(0,SW.base+dy);$('sheet').style.transform=`translateY(${SW.d}px)`;return;
  }
  if(!SW.on&&!SW.lvl){if(!e.cancelable||scrolled(SW.scr)){SW=null;return}  // B167: it is a scroll
    if(SW.open&&HB&&!atAll()&&!oneProject(H.projects)&&swipeTakes(dx,dy,false)==='drag'){SW.lvl=true;if(DR)dragEnd()}  // F150: up a level
    else{const s=swipeTakes(dx,dy,SW.open);if(s==='wait')return;if(!s){SW=null;return}
    SW.on=true;if(DR)dragEnd();SW.base=Math.max(-SW.w,grab($('side'),'m41',SW.open?0:-SW.w));$('side').classList.add('drag');$('scrim').classList.add('drag','on')}}
  if(e.cancelable)e.preventDefault();  // B167: no scroll until the finger lifts
  SW.d=dx;if(SW.lvl)return;
  if(e.timeStamp>SW.lt){SW.v=(t.clientX-SW.lx)/(e.timeStamp-SW.lt);SW.lx=t.clientX;SW.lt=e.timeStamp}
  const at=SW.px=Math.max(-SW.w,Math.min(0,SW.base+dx));
  $('side').style.transform=`translateX(${at}px)`;$('scrim').style.opacity=String(1+at/SW.w);
},{passive:false});
function swipeEnd(done){
  const w=SW;SW=null;if(w&&w.lvl){noClick=true;setTimeout(()=>noClick=false,50);PD.down=false;if(done&&w.d>48)goUp();return}
  if(!w||!w.on)return;
  const still=performance.now()-w.lt>120, v=still?0:w.v;  // it rested before it was let go
  if(w.sheet){const el=$('sheet'), go=done&&(w.d>80||v>.5&&w.d>10);el.style.transform='';
    if(go)closeSheet();
    if(drawerOn())springRun(el,springFrames(w.d,go?el.offsetHeight*1.03:0,v).map(x=>Math.max(0,x)),x=>({transform:`translateY(${x}px)`}));else el.classList.remove('drag');
    return}
  const side=$('side'), scrim=$('scrim');side.style.transform='';scrim.style.opacity='';
  S.drawer=done?swipeOpens(w.d,v,w.w,w.open):w.open;
  noClick=true;setTimeout(()=>noClick=false,50);PD.down=false;render(true);
  const fs=springFrames(w.px||0,S.drawer?0:-w.w,v).map(x=>Math.max(-w.w,Math.min(0,x)));side._to=S.drawer;
  springRun(side,fs,x=>({transform:`translateX(${x}px)`}));springRun(scrim,fs,x=>({opacity:1+x/w.w}));
}
document.addEventListener('touchend',e=>{if(SW&&SW.on&&!SW.sheet&&[...e.touches].some(f=>f.identifier===SW.id))return;swipeEnd(true)},{passive:true});
document.addEventListener('touchcancel',()=>swipeEnd(false),{passive:true});
/* F150: switching draws the project's last snapshot at once. One is kept per project, the last SNAPS of them, each up to
   SNAP_MAX characters (the rest of this browser's room is the outbox's) */
const SNAP='ar-snap:', SNAPS=6, SNAP_MAX=200000;
function snapKeep(){
  if(HOME_PAGE||!HKEY||!S.snap.at)return;
  const text=JSON.stringify(snapKept(S.snap));if(text.length>SNAP_MAX){store.set(SNAP+HKEY,'');return}
  let l;try{l=JSON.parse(store.get(SNAP+'@')||'[]')}catch(e){}
  l=[HKEY,...(Array.isArray(l)?l:[]).filter(k=>k!==HKEY)];
  for(const k of l.slice(SNAPS))store.set(SNAP+k,'');
  store.set(SNAP+'@',JSON.stringify(l.slice(0,SNAPS)));store.set(SNAP+HKEY,text);
}
function snapTake(){
  if(HOME_PAGE||!HKEY)return;
  let s;try{s=JSON.parse(store.get(SNAP+HKEY)||'null')}catch(e){}
  if(s&&typeof s==='object'&&['status','sessions','queue','needs','concepts','log'].every(k=>Array.isArray(s[k])))S.snap={...S.snap,...s};
}
addEventListener('pagehide',snapKeep);
document.addEventListener('visibilitychange',()=>{if(document.hidden)snapKeep()});
addEventListener('pagehide',finalDelete);  // F118: leaving the page makes a pending delete final

projectsKept();snapTake();H.tab=tabStore.get('ar-alltab');  // F150: what was last seen draws at once
takePlace();  // B177: before the first draw
takeTyped();  // F149
render(true);
if(HOME_PAGE){  // F134: Home's own page: no run behind it, only Home's projects and devices
  loadProjects();loadDevices();homeDrain();setInterval(loadProjects,HKEY?2500:5000);setInterval(loadDevices,30000);
}else{
connect();
placeLoad();  // B177
drain();  // F137: what a reload left in the outbox goes now (the run page runs each cid once)
if(HB){loadProjects();homeDrain();let tick=0;  // F134: every 5 s while All projects shows, else every 30 s
  setInterval(()=>{if(atAll()||++tick%6===0)loadProjects()},5000);
  setInterval(()=>{if(atAll())loadDevices()},30000);loadDevices()}
}
/* B179: a concept's page in the Home Screen app, where a new tab would be iOS's browser over the app */
function conceptOpen(src,title){
  const el=$('cview');
  el.innerHTML=`<div class="top"><button class="icon" data-cviewclose aria-label="Back" title="Back">${I.back}</button><b class="ell">${esc(title)}</b></div><iframe src="${esc(src)}" sandbox="allow-scripts" title="${esc(title)}"></iframe>`;
  el.hidden=false;el.querySelector('button').focus({preventScroll:true});
}
function conceptClose(){const el=$('cview');el.hidden=true;el.innerHTML=''}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-cviewclose]')){conceptClose();return}
  const a=ON_HOME_SCREEN&&e.target.closest('a[target="_blank"]'), k=a?appLink(a.href,location.origin,ROOT):'';
  if(!k)return;
  e.preventDefault();
  if(k==='concept'){const q=a.closest('.card')&&a.closest('.card').querySelector('.q');conceptOpen(a.href,q?q.textContent:'Concept')}
  else location.href=a.href;
});
/* Esc closes the topmost thing only */
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('cview').hidden===false){e.preventDefault();e.stopImmediatePropagation();conceptClose()}},true);
</script>
