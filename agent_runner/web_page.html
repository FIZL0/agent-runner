<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>agent-runner</title>
<script>
/* F81: the view this browser last chose (localStorage), else [ui] web (the server writes it into WEB_VIEW): on
   'terminal' the link opens the terminal-style page (/term) instead. */
const WEB_VIEW=/*WEB_VIEW*/'app', VIEW_KEY='agent-runner.view';
/* F134: true on Runner Home's own page (home.home_page): the All projects view, no run behind it, no terminal view */
const HOME_PAGE=/*HOME_PAGE*/false;
(()=>{let v='';try{v=localStorage.getItem(VIEW_KEY)||''}catch(e){}if(HOME_PAGE)return;
  if((v||WEB_VIEW)==='terminal')location.replace('term'+location.search)})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Style rules: docs/STYLE.md. Read it before you change how this page looks, moves or speaks, and follow it;
   tests/test_web.py (test_style_f83) checks the parts a machine can. */
/* F79: the run app, a calm chat app over F74's model (the snapshot, the feeds, the actions). Warm off-white
   (dark: warm grey), serif for headings and replies, a rust accent, thin line icons, one big rounded message
   box. It switches layout by its own width (container query): a sidebar on a desktop, a drawer on a phone. */
:root{
  --bg:#faf9f5; --side:#f5f4ee; --surface:#ffffff; --bubble:#f0eee6; --fg:#141413; --muted:#73726c; --faint:#a3a199;
  --line:#e8e6dc; --line2:#dcd9cd; --accent:#c96442; --accent2:#b5573a; --onaccent:#ffffff; --ok:#4f7a43;
  --warn:#a8711a; --bad:#b0412e; --onbad:#ffffff; --scrim:rgba(0,0,0,.25); --shadow:rgba(0,0,0,.15); --lift:rgba(0,0,0,.04);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-xs:11px; --fs-s:12px; --fs-m:13px; --fs-n:14px; --fs-b:15px; --fs-l:17px; --fs-xl:30px;
  --r-xs:4px; --r-s:8px; --r-m:10px; --r-l:16px; --r-xl:20px; --r-full:99px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --tap:44px;
  --dur-fast:150ms; --dur:200ms; --dur-slow:250ms; --ease:cubic-bezier(.2,.8,.2,1); --pulse:1.6s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --onbad:#262624; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); --lift:rgba(0,0,0,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --bubble:#3a3936; --fg:#f3f1ea; --muted:#a3a199; --faint:#7d7b74;
  --line:#3b3a37; --line2:#4a4945; --accent:#d97757; --accent2:#e08868; --onaccent:#ffffff; --ok:#8fb07c;
  --warn:#d9a54a; --bad:#e07a66; --onbad:#262624; --scrim:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.4); --lift:rgba(0,0,0,.12); color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:none} *::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{container-type:inline-size;height:100vh;height:100dvh;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* B160: the keyboard is open: kbFit() sets .app's top and height from visualViewport, and nothing pans the page */
.app.kb{position:fixed;left:0;right:0;container-type:size;padding-bottom:0}
.app.kb .dock{padding-bottom:8px} .app.kb .sheet{padding-bottom:12px} .app.kb .slash{max-height:min(320px,50cqh)}
.app.kb .top,.app.kb .dock,.app.kb .scrim{touch-action:pinch-zoom}
.shell{flex:1;min-height:0;min-width:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr)}

/* the sidebar: a drawer on a phone */
.side{position:absolute;inset:0 auto 0 0;width:280px;max-width:85%;background:var(--side);border-right:1px solid var(--line);z-index:6;
  transform:translateX(-102%);transition:transform var(--dur-slow) var(--ease),visibility var(--dur-slow);display:flex;flex-direction:column;padding:12px 10px;
  padding-left:max(10px,env(safe-area-inset-left,0px));overflow:auto;touch-action:pan-y pinch-zoom}
.side.open{transform:none;box-shadow:8px 0 30px var(--shadow)}
.side:not(.open):not(.drag){visibility:hidden}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5;opacity:0;visibility:hidden;touch-action:pan-y pinch-zoom;transition:opacity var(--dur-slow) var(--ease),visibility var(--dur-slow)}
.scrim.on{opacity:1;visibility:visible}
.side.drag,.sheet.drag,.scrim.drag{transition:none}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;color:inherit;text-decoration:none}
.logo{width:28px;height:28px;border-radius:var(--r-s);background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font:600 13px var(--serif);flex:none}
.brand b{font:500 17px var(--serif)}
.newchat{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:var(--r-m);padding:8px 10px;cursor:pointer;font-weight:500;color:var(--accent)}
.newchat .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
.newchat .plus svg{width:14px;height:14px;stroke-width:2.2}
.nav{display:grid;gap:1px;margin-top:6px}
.ni{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:var(--r-m);padding:8px 10px;cursor:pointer;text-align:left;color:var(--fg)}
.ni:hover{background:var(--bubble)} .ni.on{background:var(--bubble);font-weight:500}
.ni .n{margin-left:auto;font-size:var(--fs-s);background:var(--accent);color:var(--onaccent);border-radius:var(--r-full);padding:0 7px}
.shead{font-size:var(--fs-s);color:var(--muted);padding:14px 10px 4px}
.shead.row{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.shadd{width:26px;height:26px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.shadd:hover{background:var(--bubble);color:var(--fg)} .shadd svg{width:16px;height:16px;stroke-width:2}
.thread{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:var(--r-m);padding:7px 10px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font-size:var(--fs-n)}
.thread:hover{background:var(--bubble)} .thread.on{background:var(--bubble)}
.thread .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .off{width:7px;height:7px;border-radius:50%;border:1px solid var(--faint);flex:none}
/* F118: a chat row's delete button (on hover; always on touch), its Undo, the selection and its Delete N bar */
.crow{position:relative} .crow .thread{padding-right:38px}
.crow .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);height:28px;min-width:28px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;font-size:var(--fs-s);font-weight:500}
.crow:hover .del,.crow:focus-within .del,.crow .del.undo{opacity:1} .crow .del:hover{background:var(--line2);color:var(--fg)}
.crow .del svg{width:15px;height:15px} .crow .del.undo{padding:0 8px;color:var(--accent)}
@media (hover:none){.crow .del{opacity:1}}
/* F133: the pin button beside delete (always shown on a pinned chat), and a row being dragged */
.crow[data-crow] .thread{padding-right:68px} .crow[data-crow="c1"] .thread{padding-right:38px}
.crow .pin{position:absolute;right:34px;top:50%;transform:translateY(-50%);height:28px;width:28px;border:0;border-radius:var(--r-s);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0}
.crow[data-crow="c1"] .pin{right:4px}
.crow:hover .pin,.crow:focus-within .pin,.crow .pin.on{opacity:1} .crow .pin.on{color:var(--accent)} .crow .pin:hover{background:var(--line2);color:var(--fg)}
.crow .pin svg{width:15px;height:15px}
@media (hover:none){.crow .pin{opacity:1}}
.crow[data-crow]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.crow.lift,.crow.drag{background:var(--line2);border-radius:var(--r-m)} .crow.drag{position:relative;z-index:5;box-shadow:0 4px 14px var(--shadow);opacity:.95}
.thread.sel{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.thread.gone{opacity:.5;cursor:default} .thread.gone .t{text-decoration:line-through}
.selbar{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:var(--fs-m);color:var(--muted)} .selbar span{flex:1}
.selbar .btn{padding:4px 10px;font-size:var(--fs-m)}
.none{font-size:var(--fs-m);color:var(--faint);padding:4px 10px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse var(--pulse) infinite}
@keyframes pulse{50%{opacity:.35}}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 4px;border-top:1px solid var(--line);font-size:var(--fs-m);color:var(--muted)}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 12px var(--sans);flex:none}
.me .sub{font-size:var(--fs-xs)}
.viewsw{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-size:var(--fs-s);color:var(--muted);text-decoration:none}
.viewsw:hover{color:var(--fg)} .viewsw svg{width:15px;height:15px}
/* F134: the project switcher at the top of the sidebar (through Runner Home), and its list of Home's projects */
.psw{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:var(--r-m);padding:6px 8px;margin-bottom:8px;cursor:pointer;text-align:left;color:var(--fg)}
.psw:hover{background:var(--bubble)} .psw b{font:500 17px var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psw .cv{transition:transform var(--dur-fast) var(--ease);color:var(--muted)} .psw.open .cv{transform:rotate(90deg)}
.plist{display:grid;gap:1px;margin:-4px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;border-radius:var(--r-m);padding:7px 10px;text-decoration:none;color:var(--fg);font-size:var(--fs-n)}
.prow:hover{background:var(--bubble)} .prow.on{background:var(--bubble);font-weight:500}
.prow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .prow .st{font-size:var(--fs-s);color:var(--muted)}
.prow .n{font-size:var(--fs-s);background:var(--accent);color:var(--onaccent);border-radius:var(--r-full);padding:0 7px}
.pdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line2)} .pdot.running{background:var(--ok)} .pdot.idle{background:var(--warn)}
.padd{display:flex;gap:8px;flex-wrap:wrap} .padd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-m);padding:7px 10px;font:16px/1.35 var(--sans);background:var(--bg);color:var(--fg)}
.meter{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--fs-m)}
.meter .bar{height:6px;background:var(--line);border-radius:var(--r-xs);overflow:hidden} .meter .bar i{display:block;height:100%;background:var(--ok)}
.meter .bar i.w{background:var(--warn)} .meter .bar i.b{background:var(--bad)} .meter .r{color:var(--muted)}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}

/* the main column */
.main{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;touch-action:pan-y pinch-zoom}
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;padding-right:max(10px,env(safe-area-inset-right,0px))}
.icon{width:36px;height:36px;border-radius:var(--r-m);border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.icon:hover{background:var(--bubble)}
.top .title{flex:1;min-width:0;text-align:center;font-weight:500;font-size:var(--fs-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow:auto;min-height:0;overflow-anchor:none;overscroll-behavior:contain}
.col{max-width:720px;margin:0 auto;padding:6px 16px 24px;display:grid;gap:12px}
.greet{font:400 30px/1.2 var(--serif);text-align:center;margin:18px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px}
.greet .logo{width:30px;height:30px;font-size:var(--fs-b)}
.sec{font-size:var(--fs-m);color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.sec .ln{flex:1;height:1px;background:var(--line)}
.kform{display:grid;gap:8px} .kform textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;font:16px/1.35 var(--sans);background:var(--bg);color:var(--fg);resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:grid;gap:10px;min-width:0}
.card.tap{cursor:pointer} .card.tap:hover{border-color:var(--line2)}
.card.need{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.q{font:500 17px/1.35 var(--serif);overflow-wrap:anywhere}
.q.clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;padding:0;font:500 13px var(--sans);color:var(--accent);cursor:pointer;justify-self:start}
.small{font-size:var(--fs-m);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{width:34px;height:34px;border-radius:var(--r-m);background:var(--bubble);display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted);flex:none}
.status{font-size:var(--fs-s);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.quote{font:400 15px/1.45 var(--serif);color:var(--fg);border-left:2px solid var(--line2);padding-left:10px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-m);padding:7px 14px;font-weight:500;font-size:var(--fs-n);cursor:pointer;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bubble)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.acc{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.card.relph{opacity:.6}
.btn.busy{opacity:.7;cursor:progress}
.btn.bad{background:var(--bad);color:var(--onbad);border-color:var(--bad)}
.sure{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.slotsn{display:inline-flex;gap:6px;align-items:center}
.slotsn input{width:64px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:var(--r-m);padding:7px 8px;font:16px/1.35 var(--sans)}
.chev{color:var(--faint);display:grid}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:7px 12px;font-size:var(--fs-m);cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--fg)}
.chip svg{width:15px;height:15px;color:var(--muted)}
.chip:hover{background:var(--bubble)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:4px 2px;min-width:0}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bubble);color:var(--muted)}
.ev .ic svg{width:14px;height:14px}
.ev .ic.ok{color:var(--ok)} .ev .ic.bad{color:var(--bad)} .ev .ic.go{color:var(--accent)}
.ev .txt{min-width:0;overflow-wrap:anywhere}

/* the message box */
.box{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-xl);padding:12px 12px 10px 16px;display:grid;gap:8px;box-shadow:0 2px 10px var(--lift);margin:0}
.box:focus-within{border-color:var(--faint)}
.box textarea{border:0;outline:0;resize:none;background:none;font:16px/1.45 var(--sans);color:var(--fg);min-height:26px;max-height:160px;padding:2px 0;width:100%}
.box textarea::placeholder{color:var(--faint)}
.boxrow{display:flex;align-items:center;gap:6px}
.tool{height:32px;min-width:32px;border-radius:var(--r-s);border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;cursor:pointer;color:var(--muted);font-size:var(--fs-m)}
.tool:hover{background:var(--bubble);color:var(--fg)}
.to{font-size:var(--fs-m);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.send{margin-left:auto;width:32px;height:32px;border-radius:var(--r-s);border:0;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;cursor:pointer;flex:none}
.send.stop{background:var(--fg);color:var(--bg)} .send.stop+.send{margin-left:0}
.send:disabled{opacity:.4;cursor:default}
.send svg{stroke-width:2.2}
.ctx{display:flex;align-items:center;gap:8px;font-size:var(--fs-m);color:var(--muted);min-width:0}
.ctx b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.x{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 4px}
.atts{display:flex;gap:8px;flex-wrap:wrap}
.att{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);padding:6px 10px 6px 6px;font-size:var(--fs-s);background:var(--bg);max-width:220px}
.att span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.att img,.att .fi{width:34px;height:34px;border-radius:var(--r-s);object-fit:cover;background:var(--bubble);display:grid;place-items:center;flex:none}
.att.up{opacity:.55} .att.err{border-color:var(--bad)}
.att .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:var(--fs-xs);line-height:1;padding:0}
.dock{padding:8px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock .box{max-width:720px;margin:0 auto}
.foot{font-size:var(--fs-xs);color:var(--faint);text-align:center;margin-top:6px}

/* a conversation */
.msgs{display:grid;gap:18px;padding:8px 0 10px}
.u{justify-self:end;max-width:80%;background:var(--bubble);border-radius:var(--r-xl);padding:9px 14px;display:grid;gap:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.u.pending{opacity:.7}
.u img{max-width:200px;border-radius:var(--r-m)}
.u .file{font-size:var(--fs-s);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.a{display:grid;gap:8px;font:400 16.5px/1.6 var(--serif);max-width:100%;min-width:0;overflow-wrap:anywhere}
.a .lead{display:flex;align-items:center;gap:8px;font:500 13px var(--sans);color:var(--muted)}
.a .lead .logo{width:22px;height:22px;font-size:var(--fs-xs);border-radius:var(--r-s)}
.a p{margin:0} .a ul,.a ol{margin:0;padding-left:1.3em}
.a code{font:13.5px var(--mono);background:var(--bubble);border-radius:var(--r-s);padding:1px 5px}
.a pre{font:12.5px/1.55 var(--mono);background:var(--side);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;overflow:auto;margin:0;white-space:pre}
.a pre code{background:none;padding:0}

<div class="app" id="app">
  <div class="shell">
    <div class="scrim" id="scrim"></div>
    <aside class="side" id="side" aria-label="Sidebar"></aside>
    <section class="main">
      <div class="top" id="top"></div>
      <div class="notices"><div class="offline" id="offline" role="status" hidden>Lost the run page's connection: trying again…</div>
      <div class="obbar" id="obbar" hidden></div></div>
      <div class="body" id="body"></div>
      <div class="dockwrap"><button type="button" class="jump" id="jump" data-jump aria-label="Jump to the latest" title="Jump to the latest"></button>
      <div class="dock" id="dock"></div></div>
    </section>
    <div class="scrim sheetscrim" id="sheetscrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>
  <input type="file" multiple hidden id="file">
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="obpop" id="obpop" hidden></div>

<script id="logic">
/* The page's pure parts, run in node by tests/test_web.py: no DOM here. */
/* a Needs you item's possible answers (F74): yes / no for a CONFIRM or a yes-or-no ask, else its options */
function answerOpts(it){
  if(!it)return[];
  const opts=Array.isArray(it.options)&&it.options.length?it.options.map(String):
    it.label==='CONFIRM'||/\byes ?(\/|or) ?no\b/i.test(it.ask||'')?['Yes','No']:[];
  return opts.map(o=>o.charAt(0).toUpperCase()+o.slice(1));
}
/* B152: a Needs you card's ask: short (ask_short: first sentence, no paths or asides) clamped to 2 lines with a More
   that opens the whole ask in place, Less to fold it again; the title under it on one line with an ellipsis */
const ASK_LONG=80;
function needAsk(n,i,open){
  const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const full=(n&&(n.ask||n.title||n.what))||'', short=(n&&n.ask_short)||full;
  const more=short!==full||full.length>ASK_LONG;
  const q=open&&more?`<div class="q">${e(full)}</div>`:`<div class="q clamp">${e(short)}</div>`;
  return q+(more?`<button class="more" data-more="${i}" aria-expanded="${open?'true':'false'}">${open?'Less':'More'}</button>`:'');
}
/* B138: an answered item stays off Needs you for a while (GONE_MS), so a snapshot taken before the answer landed
   does not bring a stale card back; gone maps an id to when it was answered */
const GONE_MS=30000;
function goneMark(gone,r,now){const g={...(gone||{})};if(r&&r.ok&&r.gone)g[r.gone]=now;return g}
function needsShown(needs,gone,now){return(needs||[]).filter(n=>!(gone&&gone[n.id]!=null&&now-gone[n.id]<GONE_MS))}
/* what the toast says once an answer button's command ran: the run's own words ('R13 ticked'), else the reply */
function answerSaid(r,id,v){return(r&&r.said)||(r&&r.gone?`${id}: ${v}`:`Sent to the project chat: ${id} ${v}`)}
/* a session's feed entries (say / you / tool / out) as a conversation: your words as {w:'u'}, the agent's as
   {w:'a', text, steps}; tool steps (and their output) fold into the reply that follows them */
function threadMsgs(entries){
  const out=[];let steps=[],k='';  // B134/F83: k, a message's own key (its first entry's id), '' when the feed has none
  const put=(m,e)=>{const id=k||(e&&e.id)||'';out.push(id?{...m,k:id}:m);k=''};
  for(const e of entries||[]){
    if(e.kind==='tool'){if(!steps.length)k=e.id||'';steps.push({tool:e.text,out:''})}
    else if(e.kind==='out'){if(!steps.length)k=e.id||'';if(steps.length&&!steps[steps.length-1].out)steps[steps.length-1].out=e.text;else steps.push({tool:'',out:e.text})}
    else if(e.kind==='say'){put({w:'a',text:e.text,steps},e);steps=[]}
    else if(e.kind==='you'){if(steps.length)put({w:'a',text:'',steps}),steps=[];put({w:'u',text:e.text},e)}
  }
  if(steps.length)put({w:'a',text:'',steps});
  return out;
}
/* is the session working: its last entry is a tool step, its output, or your words not yet answered */
function working(entries){
  const l=(entries||[])[(entries||[]).length-1];
  if(!l)return false;
  if(l.kind==='out'&&l.text==='interrupted')return false;
  return l.kind!=='say';
}
/* a queued task's state, in plain words */
function planWords(q,sessions){
  const s=(sessions||[]).find(x=>x.task===q.id);
  if(q.release)return q.release.words;  // F131: the release row's words, as status says them

async function drain(){
  if(OB.busy)return;OB.busy=true;clearTimeout(OB.timer);
  try{
    for(let it;(it=obNext(S.ob));){
      let j;
      try{const r=await fetch(tq('act'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:it.name,args:it.args,cid:it.cid})});
        if(r.status>=500)throw new Error(`HTTP ${r.status}`);
        j=await r.json()}
      catch(e){OB.offline=true;OB.timer=setTimeout(drain,OB.wait);OB.wait=Math.min(OB.wait*2,30000);obDraw();return}
      OB.offline=false;OB.wait=2000;
      if(!S.ob.some(x=>x.cid===it.cid))continue;  // discarded while it went
      obChange(b=>obSettle(b,it.cid,j));

/* what the page does once the run answered an item */
function obDone(it,j){
  const now=Date.now(), snapNow=()=>fetch(tq('snapshot')).then(s=>s.json()).then(takeSnap).catch(()=>{});
  if(it.set&&!(j&&j.ok))delete S.f[`set:${it.name==='setting_project'?'project':'device'}:${it.set.id}`];  // the field shows what is kept again
  if(!j||!j.ok){toast(`Not sent: ${it.say}`,true);S.obOpen=true;if(it.need||it.concept)snapNow();return}
  if(it.newchat&&!j.name&&S.waitNew)S.waitNew.sent={j,ask:it.ask};  // B154: takeSnap finds its name
  if(it.newchat&&j.name){carrySent(j.name,j,it.ask);if(S.waitNew&&S.waitNew.ph==='@'+it.cid)S.waitNew=null;if(S.thread==='@'+it.cid)open(j.name)}
  else if(it.name==='chat_to'){const to=j.name||it.args.to;  // B154: c1 was not up: the new chat that took it
    addSent(to,it.args.text,j.at,j.name?{first:true}:{});if(to!==it.args.to&&S.thread===it.args.to)open(to)}
  else if(it.need&&(it.name==='answer'||it.name==='need_drop'||it.name==='pitch_no')){toast(answerSaid(j,it.need,it.args.text));S.gone=goneMark(S.gone,j,now);snapNow()}
  else if(it.concept){S.gone={...(S.gone||{}),[it.concept]:now}}  // a picked concept stays off while the run catches up
  else if(it.name==='plan_add'&&it.args.kind==='K'){S.kSaid=`Queued ${queuedId(j.out)||'a new concept'}: a run writes its options page, and it shows here.`;toast(S.kSaid)}
  else if(it.ren){const x=sessionOf(it.ren);if(x){x.title=it.args.title;x.renamed=true}}  // F129
  else if(it.set){if(it.set.applies!=='now')S.setWait=true;delete S.f[`set:${it.name==='setting_project'?'project':'device'}:${it.set.id}`];loadSettings();toast(it.name==='setting_project'?`${queuedTask(j.out)} queued: the setting lands through the gate`:String(j.out||'Saved').split('\n')[0])}  // F97
  else if(it.ctl){if(it.name==='run_control'&&it.args.key==='wip_show'){S.out={title:it.args.tid,text:String(j.out||'')};openSheet('out')}
    else toast(String(j.out||'').split('\n')[0]||`${it.say}: done`)}  // F124: a run control
  if(it.done)toast(it.done);
}

/* --- a little markdown for replies: code blocks, inline code, bold, links, lists, headings ------------------ */
function md(src){
  const parts=String(src||'').split(/```[^\n]*\n?/);let h='';
  parts.forEach((p,i)=>{
    if(i%2){h+=`<pre><code>${esc(p.replace(/\n$/,''))}</code></pre>`;return}
    const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    for(const block of p.split(/\n{2,}/)){
      const b=block.trim();if(!b)continue;const ls=b.split('\n');
      if(ls.every(l=>/^\s*[-*] /.test(l)))h+='<ul>'+ls.map(l=>`<li>${inline(l.replace(/^\s*[-*] /,''))}</li>`).join('')+'</ul>';
      else if(ls.every(l=>/^\s*\d+[.)] /.test(l)))h+='<ol>'+ls.map(l=>`<li>${inline(l.replace(/^\s*\d+[.)] /,''))}</li>`).join('')+'</ol>';
      else if(/^#{1,4} /.test(b)&&ls.length===1)h+=`<h3>${inline(b.replace(/^#+ /,''))}</h3>`;
      else h+=`<p>${ls.map(inline).join('<br>')}</p>`;
    }
  });
  return h;
}

  try{const d=await (await fetch(tq(HB+path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    toast(d.out||(d.ok?'Done':'That did not work'),!d.ok)}
  catch(e){toast(`Could not reach Runner Home: ${e}`,true)}
  H.busy=false;loadProjects();
}
/* F118: a chat row: its delete button (none for c1), dimmed with Undo in that spot once deleted; the Delete N bar */
function chatRow(s,quiet){
  const n=s.name,u=S.undo,gone=!!(u&&u.names.includes(n)),cls=[S.thread===n&&!gone?'on':'',S.sel.includes(n)?'sel':'',gone?'gone':''].join(' ');
  if(S.ren&&S.ren===n)return `<form class="renform" data-renform><input data-f="ren" aria-label="The chat's name" maxlength="80" autocomplete="off"></form>`;  // F129
  const due=!gone&&replyDue(s);  // F128
  const row=`<button class="thread ${cls}" ${gone?'':`data-thread="${esc(n)}" title="Double-click to rename"`}>${s.state==='live'?'':'<span class="off" title="not running"></span>'}<span class="t">${esc(chatTitle(s))}</span>${due?'<span class="bdot" role="img" aria-label="needs your reply" title="needs your reply"></span>':''}</button>`;
  const btn=gone?(u.bar?'':`<button class="del undo" data-undo>Undo</button>`):
    n==='c1'?'':`<button class="del" data-del="${esc(n)}" aria-label="Delete this chat" title="Delete this chat">${I.trash}</button>`;
  const pinned=chatPins().includes(n), pin=gone?'':`<button class="pin${pinned?' on':''}" data-pin="${esc(n)}" aria-pressed="${pinned}" aria-label="${pinned?'Unpin':'Pin'} this chat" title="${pinned?'Unpin':'Pin'} this chat">${I.pin}</button>`;
  const menu=gone?'':`<button class="rowmenu" data-rowmenu="${esc(n)}" aria-label="More for this chat">${I.dots}</button>`;
  return `<div class="crow${quiet?' quiet':''}${pinned?' pinned':''}" ${gone?'':`data-crow="${esc(n)}"`}>${row}${pin}${btn}${menu}</div>`;
}
/* F129: Rename, in the row itself: Enter keeps it, Esc does not */

function saveRename(){
  const n=S.ren, title=String(S.f.ren||'').replace(/\s+/g,' ').trim(), x=sessionOf(n);S.ren=null;

/* F118: a delete is final once the person clicks anything but Undo (or leaves the page): only then is it sent */
function finalDelete(){
  const u=S.undo;if(!u)return;S.undo=null;
  if(u.names.includes(S.thread)){S.thread=null;S.ctx=null}
  S.snap.sessions=S.snap.sessions.filter(s=>!u.names.includes(s.name));
  fetch(tq('act'),{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'delete_chats',args:{names:u.names}})})
    .then(r=>r.json()).then(j=>{if(!j.ok)toast(j.out||'The delete did not work',true)}).catch(e=>toast(`Could not reach the run page: ${e}`,true));
  render(true);
}

function convo(n,shown){  // F93: shown, how a message of yours shows (Talk: without its brief or reminder)
  const talk=!!shown;shown=shown||(t=>t);
  const f=S.feeds[n], agent=isAgent(n), title=threadTitle(n);
  if(!f)return `<div class="msgs">${String(n||'')[0]==='@'?'':'<div class="think">'+LOGO()+'Loading…</div>'}${sentBubbles(n,shown)}${startLine(n)}${obBubbles(n)}</div>`;  // F137
  const ms=threadMsgs(f.entries);
  let h=f.more?'<div class="older">Older messages are on its session page.</div>':'';
  if(!ms.length)h+=`<div class="small" style="text-align:center">${esc(f.out||'Nothing said here yet.')}</div>`;
  ms.forEach((m,i)=>{
    const mk=esc(m.k||n+':'+i);
    if(m.w==='u'){h+=`<div class="u" data-k="${mk}" data-t="${esc(tkey(shown(m.text)))}">${esc(shown(m.text))}</div>`;return}
    const lead=i===0||ms[i-1].w!=='a'?`<div class="lead">${agent?`<span class="logo">${esc(n)}</span>`:LOGO()}${esc(agent?title:PN())}</div>`:'';
    const k=m.k||n+':'+i, open=S.openSteps[k];
    const st=m.steps.length?`<button class="steps ${open?'open':''}" data-steps="${esc(k)}" aria-expanded="${!!open}">${I.chev}Ran ${m.steps.length} step${m.steps.length>1?'s':''}</button>${open?`<div class="stepbox">${m.steps.map(s=>(s.tool?`<span class="tl">${esc(s.tool)}</span>`:'')+(s.out?`\n<span class="o">  ⎿ ${esc(s.out).replace(/\n/g,'\n    ')}</span>`:'')).join('\n')}</div>`:''}`:'';  // F115: tool lines as in the terminal
    const on=TK.playing===k;  // F124: a Talk reply's play button
    const play=talk&&m.text?`<button type="button" class="speakb${on?' on':''}" data-speak="${esc(k)}" aria-pressed="${on}" aria-label="${on?'Stop reading':'Read this reply aloud'}" title="${on?'Stop reading':'Read this reply aloud'}">${on?I.stop:I.speak}</button>`:'';
    h+=`<div class="a" data-k="${mk}">${lead}${st}${m.text?`<div class="say" data-k="say:${mk}">${md(m.text)}</div>`:''}${play}</div>`;
  });
  h+=sentBubbles(n,shown);  // B154
  h+=obBubbles(n);  // F137: messages still in the outbox
  if(starting(n))h+=startLine(n);
  else if(busy(n))h+=`<div class="think">${LOGO()}Working on it… · Ctrl+C interrupts<button type="button" class="btn mini" data-stop="${esc(n)}">Stop</button></div>`;
  return `<div class="msgs">${h}</div>`;
}

/* B162: one recognizer at a time (iOS allows one, and aborts the second): MIC.rec is the one under way or still

const MIC={rec:null,next:null,timer:0}, MIC_WAIT=1500, MIC_RETRY=250, MIC_END=5000;
function micWhenFree(start,cancel){
  if(MIC.next&&MIC.next.cancel)MIC.next.cancel();

  const old=MIC.rec;if(!old)return start();
  MIC.next={start,cancel};
  /* the abort's own onend starts the next; with none after as long again, the old one is taken for gone */
  const gone=()=>{if(MIC.rec!==old)return;if(TK.trail)micLog('the old one is taken for gone');const end=old.onend;old.onresult=old.onerror=old.onend=null;if(end)end()};
  MIC.timer=setTimeout(()=>{if(MIC.rec!==old)return;MIC.timer=setTimeout(gone,MIC_WAIT);if(TK.trail)micLog('abort of the old one');try{old.abort()}catch(e){}},MIC_WAIT);
  if(TK.trail)micLog('stop by the next start');
  try{old.stop()}catch(e){}
}
function micFree(rec){
  if(MIC.rec!==rec)return;
  const n=MIC.next;MIC.rec=MIC.next=null;clearTimeout(MIC.timer);if(n)n.start();
}

function dictate(){

  if(TK.state==='listening')return toast("Talk's mic is listening: tap it to stop, then dictate.",true);  /* it has the recognizer */
  const ta=document.querySelector('[data-in]');if(!ta)return;

}

/* the person's words to the Talk session; true once sent */
async function talkSend(msg){
  const to=talkName(), len=to?feedOf(to).length:0, mark=to&&S.feeds[to]?feedMark(feedOf(to)):null;  // B134
  TK.state='thinking';TK.said=msg;TK.note='';S.pin=true;unlockSpeech();render(true);
  /* B133: the wait starts before the action, which can take up to 90 s while a new chat comes up: a reply that
     lands meanwhile is heard from the polls and snapshots (talkWaitName finds the new chat by its title) */
  const w={n:to,since:to?mark:0,at:Date.now(),last:'',said:msg,out:true};TK.wait=w;render(true);
  const r=await act('talk',{text:msg,to});w.out=false;
  if(!r.ok){if(TK.wait===w)TK.wait=null;TK.state='';render(true);return false}
  const n=r.session||to, fresh=n!==to;
  if(TK.wait===w){if(fresh){w.n=n;w.since=0;w.last=''}w.at=Date.now()}  /* not yet heard; n '': found by its title */
  if(n){store.set(TALK_KEY,n);addSent(n,msg,r.at,{talk:true,...(fresh?{first:true}:{})},fresh?0:len);loadFeed(n)}
  else if(TK.wait===w&&!w.n){w.sent={text:msg,at:r.at};toast('Talk is opening its chat: it shows here once it is up')}
  render(true);return true;
}
/* a new feed for session n: once the Talk reply has stood for one poll, read it aloud */
function talkHear(n){
  const w=TK.wait;if(!w||talkWaitName()!==n)return;
  if(Date.now()-w.at>300000){TK.wait=null;if(TK.state==='thinking'){TK.state='';toast('No spoken reply came in five minutes: its chat shows where it is.',true);render(true)}return}
  const said=talkReply(feedOf(n),w.since,w.said);
  if(!said||said!==w.last){w.last=said;return}
  TK.wait=null;
  if(TS.read)speak(said);else{TK.state='';render(true)}  // F124: read replies aloud is off
}
function unlockSpeech(){  /* Safari speaks later only after a first utterance inside a tap */

/* F124: read text aloud; key, the reply a play button reads (a Talk reply read by itself has none). Auto listen:
   once a Talk reply was read to its end, the mic listens again */
function speak(text,key){
  const ss=window.speechSynthesis;
  if(!ss||!text){TK.state='';render(true);return}
  if(key&&TK.ear){micLog('stop by a play button');const r=TK.rec;TK.ear=TK.rec=null;TK.heard='';if(r)r.stop()}  // a play button stops the mic, so it does not hear the reply; nothing is sent
  if(!key||TK.state!=='thinking')TK.state='';TK.playing='';ss.cancel();
  const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text];  /* sentence by sentence: Chrome cuts one long utterance short */
  const voice=pickVoice(voices(),TS.voice), turn=TK.turn=(TK.turn||0)+1;
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=(voice&&voice.lang)||navigator.language||'en-US';if(voice)u.voice=voice;
    if(i===parts.length-1)u.onend=u.onerror=e=>{if(TK.turn!==turn||!(key?TK.playing===key:TK.state==='speaking'))return;
      TK.state=TK.state==='speaking'?'':TK.state;TK.playing='';render(true);
      if(!key&&TS.auto&&(!e||e.type!=='error')&&S.view==='talk'&&!S.thread&&!talkTyping()){TK.again=true;listen()}};
    ss.speak(u)});
  if(key)TK.playing=key;else TK.state='speaking';
  render(true);
}
function hush(){TK.playing='';if(TK.state==='speaking')TK.state='';TK.turn=(TK.turn||0)+1;if(window.speechSynthesis)speechSynthesis.cancel();render(true)}
/* a Talk reply's play button: reads that reply, or stops it */
function playReply(k){

  if(i>=0)speak(plain(ms[i].text),k);

function listen(){
  const why=micWhy();if(why)return toast(why,true);
  if(TK.state==='listening')return micStop('a tap');
  /* B132: no speechSynthesis call before rec.start() on a plain tap: on iOS it puts the audio session in playback
     and recognition hears nothing (talkSend unlocks speech). A tap during a reply only stops it; the next one listens. */
  if(TK.state==='speaking'||TK.playing){if(TK.state==='speaking')TK.state='';TK.playing='';TK.note='';TK.turn=(TK.turn||0)+1;if(window.speechSynthesis)speechSynthesis.cancel();render(true);return}
  TK.note=TK.report='';const again=TK.again;TK.again=false;  /* auto listen: one silent turn and it stops */
  /* B162: the listen: its tries, the words so far, and whether the person ended it (stopped) or held the mic again */
  const t=TK.ear={mode:again?'auto':TS.mic,tries:0,words:'',err:'',ms:null,stopped:false,more:false,on:false,msg:''};
  if(!TK.trail||TK.trail.used)micLog('listen',true);  // a press began it already
  TK.trail.used=true;t.trail=TK.trail;micLog(`listen ${t.mode}${MIC.rec?', waits for the last one to end':''}`);
  TK.state='listening';TK.heard='';render(true);

}
/* B162: one recognizer for the listen t. Aborted before any words, it is tried once more by itself */
function hear(t){
  if(TK.ear!==t)return;  // ended while it waited
  let rec;try{rec=new SR()}catch(e){micLog(`no recognizer: ${e.message||e}`,false,t.trail);TK.report=t.trail;TK.ear=null;TK.state='';toast(`The mic could not start: ${e.message||e}`,true);return render(true)}
  MIC.rec=TK.rec=rec;t.tries++;t.err=t.msg='';t.ms=null;t.on=false;talkDraw();micLog(`try ${t.tries}`);
  rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;
  const log=x=>micLog(x,false,t.trail);  // a dropped one's late events stay in its own report
  const at=Date.now();let final='', got='';
  const live=()=>{if(!t.on&&TK.ear===t){t.on=true;talkDraw()}};  // the mic takes sound: now is the time to speak
  for(const k of ['start','audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch'])rec['on'+k]=()=>{log(k);if(/^(audio|sound|speech)start$/.test(k))live()};
  rec.onresult=e=>{live();let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)final+=x[0].transcript;else interim+=x[0].transcript}
    got=final+interim;log(`result, ${got.length} letters${final?', final':''}`);if(TK.ear===t){TK.heard=(t.words+' '+got).trim();render(true)}};
  rec.onerror=e=>{t.err=e.error||'';t.msg=e.message||'';t.ms=Date.now()-at;log(`error ${t.err}${t.msg?': '+t.msg:''}`);if(TK.ear!==t)return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('The browser did not let the page use the mic: allow it in the site settings, or type below.',true);
    else if(e.error!=='no-speech'&&e.error!=='aborted')toast(`The mic stopped: ${e.error}`,true)};
  rec.onend=()=>{
    log('end');if(t.ms==null)t.ms=Date.now()-at;
    if(TK.rec===rec)TK.rec=null;
    if(TK.ear!==t)return micFree(rec);  // dropped: nothing is sent
    t.words=(t.words+' '+(final||got)).trim();
    const on=TK.state==='listening', retry=on&&t.err==='aborted'&&!t.words&&!t.stopped&&t.tries<2&&S.view==='talk'&&!S.thread&&!talkTyping()&&!document.hidden;

    if(more){t.more=t.stopped=false;t.tries=0}
    micFree(rec);
    if(more)micWhenFree(()=>hear(t));

}
/* the listen is over: its words go out, or the talk line says why there are none */
function earEnd(t){

/* the person ends the listen: the recognizer gives its last words, or a start still waiting is off */

/* F90: the run's version from the first snapshot that has one; a later, different one (the run restarted on an
   upgrade) reloads the page for its new HTML and JS. None (an older run): nothing. */
let RUN_VERSION='';
function followVersion(v){if(!v)return false;if(!RUN_VERSION){RUN_VERSION=v;return false}
  if(v!==RUN_VERSION){location.reload();return true}return false}
function takeSnap(s){
  if(!s||s.error){if(s&&s.error)toast(s.error,true);return}
  if(followVersion(s.version))return;
  S.snap={...S.snap,...s};
  if(!HOME_PAGE)document.title=pageTitle(S.snap.project);  // B153
  if(OB.offline)drain();  // F137: the run answers again: the outbox goes on at once
  S.snap.needs=needsShown(S.snap.needs,S.gone,Date.now());  // B138: a snapshot taken before an answer keeps it off
  // F137: a chat the outbox still starts is named by new_control's answer (obSettle), not by this guess
  if(S.waitNew&&S.waitNew.ph&&S.ob.some(y=>'@'+y.cid===S.waitNew.ph)){}
  else if(S.waitNew){const fresh=chats().map(c=>c.name).filter(x=>!S.waitNew.known.includes(x));
    if(fresh.length){const nm=fresh[fresh.length-1], ph=S.waitNew.ph, ws=S.waitNew.sent;S.waitNew=null;if(ws)carrySent(nm,ws.j,ws.ask);  // F137: its waiting messages go there
      if(ph){obChange(b=>obName(b,ph,nm));drain()}if(!ph||S.thread===ph)open(nm);else render();return}
    if(Date.now()-S.waitNew.at>60000)S.waitNew=null}
  for(const w of working_())if(!S.feeds[w.name]||Date.now()-(S.feeds[w.name].at||0)>15000)loadFeed(w.name);
  const tw=talkWaitName();if(tw&&TK.wait.sent){addSent(tw,TK.wait.sent.text,TK.wait.sent.at,{talk:true,first:true},0);TK.wait.sent=null}if(tw)loadFeed(tw);  // B133: each snapshot also looks for the awaited Talk reply
  render();S.live=true;
}
function connect(){

  const fine=()=>{clearTimeout(lost);lost=0;$('offline').hidden=true};
  es.onmessage=e=>{fine();try{takeSnap(JSON.parse(e.data))}catch(x){}};
  es.onerror=()=>{if(!lost)lost=setTimeout(()=>{$('offline').hidden=false},8000)};

async function poll(){try{takeSnap(await (await fetch(tq('snapshot'))).json())}catch(e){}setTimeout(poll,4000)}
async function loadFeed(n){

    const old=S.feeds[n];S.feeds[n]={...f,at:Date.now()};

/* F124: hold to talk: the mic listens while it is held, and sends when it is let go */
document.addEventListener('pointerdown',e=>{
  if(!(e.target.closest&&e.target.closest('[data-mic]'))||TS.mic!=='hold'||TK.state==='speaking'||TK.playing||e.button>0)return;
  TK.hold=true;TK.holdId=e.pointerId;
  try{e.target.closest('[data-mic]').setPointerCapture(e.pointerId)}catch(err){}  // B162: a finger that drifts off it still holds it
  if(TK.state!=='listening')listen();  // auto listen is on already: letting go sends it
  else if(TK.ear&&TK.ear.stopped)TK.ear.more=true;  // B162: held again before the last one ended: it goes on after that end
});
/* B162: a pointercancel (iOS took the touch) does not end the hold: the finger is still down. Its touchend does, and
   after a touchcancel the mic stops by itself at a silence, or at the next hold's end */
const letGo=by=>{if(TK.hold){TK.hold=false;TK.upAt=Date.now();micStop(by)}};
document.addEventListener('pointerup',e=>{if(e.pointerId===TK.holdId)letGo('pointerup')});
const onMic=e=>e.target.closest&&e.target.closest('[data-mic]');  // a touch event's target is where that finger went down
document.addEventListener('pointercancel',e=>{if(e.pointerId===TK.holdId&&e.pointerType!=='touch')TK.hold=false});  // a pen or mouse has no touchend
document.addEventListener('touchend',e=>{if(onMic(e)&&!(e.targetTouches&&e.targetTouches.length))letGo('touchend')},{passive:true});
document.addEventListener('touchcancel',e=>{if(onMic(e))TK.hold=false},{passive:true});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-mic]'))e.preventDefault()});
/* F124: a swipe right anywhere opens the sidebar drawer and a swipe left closes it, following the finger;
   a swipe down closes the sheet. B167: a touch is one thing until the finger lifts: one that scrolled never becomes a
   swipe, and a drawer swipe keeps the page from scrolling (so touchmove is not passive). Not from a text box, a sideways scroller, a held mic, a row being dragged or
   a mostly vertical move; Safari keeps its own back swipe at the very edge. */
let SW=null;
const sideways=el=>{for(;el&&el!==document.body;el=el.parentElement)if(el.scrollWidth>el.clientWidth+1&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return true;return false};
/* B167: what a touch could scroll, and did it: a change of height is the page's own scroll (a chat's new message) */
const scrollers=el=>{const a=[];for(;el&&el!==document.body;el=el.parentElement)if(el.scrollHeight>el.clientHeight+1)a.push([el,el.scrollTop,el.scrollHeight]);return a};
const scrolled=a=>a.some(s=>{const [el,top,h]=s;if(el.scrollHeight===h)return el.scrollTop!==top;s[1]=el.scrollTop;s[2]=el.scrollHeight;return false});
const drawerOn=()=>{const m=document.querySelector('.top .menu');return !!(m&&m.offsetParent)};
document.addEventListener('touchstart',e=>{
  if(SW&&SW.on&&!SW.sheet){if(e.touches.length>1)return;swipeEnd(false)}  // B167: a second finger does not end the lock
  SW=null;const t=e.touches[0], el=e.target;
  if(e.touches.length!==1||!el.closest||el.closest('input,textarea,select,[contenteditable],iframe,.obpop,.mic.hold')||DR&&DR.on)return;
  if(S.sheet){if(el.closest('#sheet')&&$('sheet').scrollTop<=0)SW={sheet:true,x:t.clientX,y:t.clientY,at:e.timeStamp,d:0,on:false};return}
  if(!drawerOn()||el.closest('#body,#dock')&&sideways(el))return;
  SW={x:t.clientX,y:t.clientY,at:e.timeStamp,d:0,on:false,open:S.drawer,w:$('side').offsetWidth||280,lx:t.clientX,lt:e.timeStamp,v:0,id:t.identifier,scr:scrollers(el)};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!SW)return;
  const t=SW.on&&[...e.touches].find(f=>f.identifier===SW.id)||e.touches[0], dx=t.clientX-SW.x, dy=t.clientY-SW.y;
  if(DR&&DR.ready&&DR.hold){if(SW.on)swipeEnd(false);SW=null;return}  // the row is held: it is being dragged
  if(SW.sheet){
    if(!SW.on){if(Math.abs(dy)<10&&Math.abs(dx)<10)return;if(dy<Math.abs(dx)||$('sheet').scrollTop>0){SW=null;return}SW.on=true;$('sheet').classList.add('drag')}
    SW.d=Math.max(0,dy);$('sheet').style.transform=`translateY(${SW.d}px)`;return;
  }
  if(!SW.on){if(!e.cancelable||scrolled(SW.scr)){SW=null;return}  // B167: it is a scroll
    const s=swipeTakes(dx,dy,SW.open);if(s==='wait')return;if(!s){SW=null;return}
    SW.on=true;if(DR)dragEnd();$('side').classList.add('drag');$('scrim').classList.add('drag','on')}
  if(e.cancelable)e.preventDefault();  // B167: no scroll until the finger lifts
  SW.d=dx;if(e.timeStamp>SW.lt){SW.v=(t.clientX-SW.lx)/(e.timeStamp-SW.lt);SW.lx=t.clientX;SW.lt=e.timeStamp}
  const at=Math.max(-SW.w,Math.min(0,SW.open?dx:dx-SW.w));
  $('side').style.transform=`translateX(${at}px)`;$('scrim').style.opacity=String(1+at/SW.w);
},{passive:false});
function swipeEnd(done){
  const w=SW;SW=null;if(!w||!w.on)return;
  if(w.sheet){const el=$('sheet');el.classList.remove('drag');el.style.transform='';if(done&&w.d>80)closeSheet();return}
  $('side').classList.remove('drag');$('scrim').classList.remove('drag');$('side').style.transform='';$('scrim').style.opacity='';
  S.drawer=done?swipeOpens(w.d,w.v,w.w,w.open):w.open;
  noClick=true;setTimeout(()=>noClick=false,50);PD.down=false;render(true);
}
document.addEventListener('touchend',e=>{if(SW&&SW.on&&!SW.sheet&&[...e.touches].some(f=>f.identifier===SW.id))return;swipeEnd(true)},{passive:true});
document.addEventListener('touchcancel',()=>swipeEnd(false),{passive:true});
addEventListener('pagehide',finalDelete);  // F118: leaving the page makes a pending delete final

render(true);
if(HOME_PAGE){  // F134: Home's own page: no run behind it, only Home's projects and devices
  loadProjects();loadDevices();setInterval(loadProjects,5000);setInterval(loadDevices,30000);
}else{
connect();
loadFeed('c1');
drain();  // F137: what a reload left in the outbox goes now (the run page runs each cid once)
if(HB){loadProjects();let tick=0;  // F134: the switcher: every 5 s while it or All projects shows, else every 30 s
  setInterval(()=>{if(H.open||S.view==='projects'||++tick%6===0)loadProjects()},5000);
  setInterval(()=>{if(S.view==='projects')loadDevices()},30000);loadDevices()}
}
</script>
</body>
</html>
