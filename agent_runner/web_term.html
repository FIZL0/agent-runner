<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Run page</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* F66 run page: lazygit layout (numbered boxed panels left, one main pane with tabs right, key hints below),
   ryha theme (black, red accent) below; F69: the server writes [ui] theme's tokens into style#theme and T picks
   another per browser (theme.py, the terminal page's table). Data: the run page model's snapshot over /events.
   F75: the final design (claude.ai/artifact/4GBeFqJ6Gn3PubWxRgrk6s) over F74's model: feeds, chats like a
   Claude session, quick asks, direct edit with a key per field, answer buttons, concepts inline.
   F81: brought back beside the run app (web_page.html) as the terminal-style page, served at /term on the same server;
   App view (T) goes back to the run app, and t is the theme picker now. */
:root{
  --bg:#000;--fg:#e5e5e5;--dim:#737373;--line:#3a3a3a;--sel:#7f1d1d;--selfg:#f5f5f5;--raise:#0d0d0d;--cur:#262626;
  --accent:#ef4444;--key:#fff;
  --red:#ef4444;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6;--bblue:#60a5fa;--magenta:#a855f7;--cyan:#06b6d4;
  --mono:"JetBrains Mono","JetBrainsMono Nerd Font Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* no visible scrollbars anywhere: every box still scrolls by wheel, touch and keys */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--mono);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--dim)}
.top b{color:var(--accent)}
.live::before{content:"●";color:var(--dim);margin-right:5px}
.live.on::before{color:var(--green)}
.top .spacer{flex:1}
button{font:inherit}
.top button,.top .viewsw{background:none;border:1px solid var(--line);color:var(--fg);padding:1px 8px;cursor:pointer;text-decoration:none}
.top button:hover,.top .viewsw:hover{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(260px,36%) minmax(0,1fr);gap:8px;min-height:0}
.left{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-height:0;min-width:0;padding-top:8px}
.box{position:relative;border:1px solid var(--line);padding:10px 2px 6px;min-height:0;min-width:0;display:flex;flex-direction:column}
.box.on{border-color:var(--accent)}
.box>.ttl{position:absolute;top:-9px;left:8px;background:var(--bg);padding:0 4px;color:var(--dim);white-space:nowrap;cursor:pointer;z-index:1}
.box.on>.ttl{color:var(--accent);font-weight:700}
.box>.cnt{position:absolute;bottom:-9px;right:8px;background:var(--bg);padding:0 4px;color:var(--dim);font-size:12px}
.list{overflow:auto;min-height:0}
.box.short .list{max-height:calc(3 * 1.45em)}
.row{display:flex;gap:8px;padding:0 10px 0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;min-width:0}
.row>span:last-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.row.cur{background:var(--raise)}
.box.on .row.cur{background:var(--sel);color:var(--selfg)}
.row .qid{flex:none;width:4.2ch;font-weight:700}
.row .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .chip{flex:none;font-style:normal;color:var(--dim);font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chip.run{color:var(--yellow)}.row .chip.crit{color:var(--red);font-weight:700}.row .chip.next{color:var(--green)}.row .chip.blk{color:var(--yellow)}.row .chip.park{color:var(--dim)}
.grp{color:var(--dim);padding:4px 10px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the selected row of the focused panel wraps: its full title, and its after line under it */
.box.on .row.cur{white-space:normal;flex-wrap:wrap;padding-block:2px}
.box.on .row.cur .qt,.box.on .row.cur>span:last-child{white-space:normal}
.box.on .row.cur .chip{color:var(--selfg)}
.box.on .row.cur .chip.after{max-width:none;flex-basis:100%;padding-left:calc(4.2ch + 8px);white-space:normal}
.g{color:var(--green)}.y{color:var(--yellow)}.r{color:var(--red)}.b{color:var(--bblue)}.m{color:var(--magenta)}.c{color:var(--cyan)}.d{color:var(--dim)}
/* a key is always a different colour from its label: yellow on the page, blue for the global keys below */
.pk{color:var(--yellow);font-weight:700;font-style:normal}
.main{margin-top:8px;min-width:0}
.mtabs{position:absolute;top:-9px;left:8px;background:var(--bg);padding:0 4px;white-space:nowrap;z-index:1}
.mtabs span{color:var(--dim);cursor:pointer}
.mtabs span[data-tab]+span[data-tab]::before{content:" - ";color:var(--dim)}
.mtabs span.on{color:var(--accent);font-weight:700}
.box.main:not(.on) .mtabs span.on{color:var(--fg)}
.pane{flex:1;overflow:auto;padding:4px 10px;white-space:pre-wrap;word-break:break-word;min-height:0}
.pane iframe{width:100%;height:100%;min-height:360px;border:0;background:var(--bg)}
.pane.term{padding:0;white-space:normal}
.pane .hunk{color:var(--cyan)}.pane .add{color:var(--green)}.pane .del{color:var(--red)}
.feedv{display:grid;gap:10px;white-space:pre-wrap}
.feedv .say::before{content:"● ";color:var(--fg)}
.feedv .you{color:var(--bblue)}.feedv .you::before{content:"❯ ";color:var(--dim)}
.feedv .tool{color:var(--dim)}.feedv .tool::before{content:"● ";color:var(--green)}
.feedv .out{color:var(--dim);padding-left:2ch;margin-top:-8px}.feedv .out::before{content:"⎿ "}
.feedv .fold{color:var(--dim);font-size:12px}
.feedv .intr{color:var(--red)}
.inrow{display:flex;gap:6px;padding:6px 8px 2px;border-top:1px solid var(--line);align-items:flex-start}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 8px 0;border-top:1px solid var(--line)}
input,textarea,select{font:inherit;background:var(--raise);color:var(--fg);border:1px solid var(--line);padding:4px 6px;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.inrow input,.inrow textarea{flex:1}
textarea.cin{resize:none;min-height:2.2em;max-height:8em}
.form{display:grid;gap:8px;max-width:640px;white-space:normal}
.form label{display:grid;gap:3px;color:var(--dim)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ahint{color:var(--dim);font-size:12px}
.kb{border:1px solid var(--line);padding:0 6px;color:var(--fg);cursor:pointer;background:none}
.kb:hover{border-color:var(--accent)}
.kb.p{border-color:var(--accent)}
.kb.p .pk{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;white-space:normal}
.opts{display:grid;gap:14px;white-space:normal;padding-top:8px}
.opt{position:relative;border:1px solid var(--line);padding:12px 12px 8px;cursor:pointer}
.opt>.t{position:absolute;top:-9px;left:8px;background:var(--bg);padding:0 4px;color:var(--dim)}
.opt.rec{border-color:var(--accent)}.opt.rec>.t{color:var(--accent);font-weight:700}
.opt.sel{border-color:var(--yellow);background:var(--raise)}.opt.sel>.t{color:var(--yellow);font-weight:700}
.opt p{margin:0 0 6px}
.foot{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .k{color:var(--yellow);font-weight:700}
.foot .gsep{color:var(--line);margin:0 10px}
.foot .glob{color:var(--dim)}.foot .glob .k{color:var(--bblue);font-weight:700}
.foot .mode{color:var(--bg);background:var(--accent);padding:0 6px;margin-right:6px;font-weight:700}
.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:10;padding:16px}
.pop .box{background:var(--bg);width:min(620px,100%);max-height:80vh;border-color:var(--accent)}
.pop .box>.ttl{color:var(--accent);font-weight:700}
.toast{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));border:1px solid var(--green);background:var(--bg);padding:6px 10px;z-index:20;max-width:min(90vw,520px);white-space:pre-wrap}
.toast.bad{border-color:var(--red)}
a{color:var(--bblue)}
:focus-visible{outline:1px solid var(--accent)}
.mnav{display:none}
.back{display:none}
/* phone width: one panel at a time, a bottom tab bar, a tap opens the item in the main pane */
@media (max-width:760px){
  body{font-size:14px}
  .top .wide,.foot,#helpbtn{display:none}
  .cols{grid-template-columns:minmax(0,1fr)}
  .left{grid-template-rows:minmax(0,1fr)!important}
  .left .box:not(.cur-panel){display:none}
  .left .box .list{max-height:none}
  .row{padding:6px 8px;white-space:normal}
  .cols.inmain .left,.cols:not(.inmain) .main{display:none}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding-top:6px}
  .mnav button{font-size:11px;background:none;border:0;color:var(--dim);display:grid;gap:1px;justify-items:center;cursor:pointer;padding:2px 0}
  .mnav button b{font-size:15px;color:var(--fg)}
  .mnav button.on,.mnav button.on b{color:var(--accent)}
  .back{display:inline;color:var(--accent);cursor:pointer;margin-right:8px}
}
.themes{display:grid;gap:6px;white-space:normal}
.themes .kb{text-align:left;padding:4px 8px}
.themes .sw{display:inline-block;width:.9em;height:.9em;margin-right:2px;vertical-align:-1px;border:1px solid var(--line)}
</style>
<style id="theme">/*THEME_CSS*/</style>
</head><body>
<div class="app">
  <div class="top">
    <span><b>agent-runner</b> · <span id="proj"></span></span>
    <span class="live" id="live">connecting…</span>
    <span class="spacer"></span>
    <a id="appview" class="viewsw" href="./" data-viewsw="app" title="the run app; this browser remembers the choice (T)"><b class="pk">T</b> App view</a>
    <button id="themebtn" title="theme (t)"><b class="pk">t</b> theme</button>
    <button id="helpbtn" title="keys (?)"><b class="pk">?</b> keys</button>
  </div>
  <div class="cols" id="cols">
    <div class="left" id="left"></div>
    <div class="box main" id="main">
      <div class="mtabs" id="mtabs"></div>
      <div class="pane" id="pane"></div>
      <div id="extra"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
  <div class="mnav" id="mnav"></div>
</div>
<div class="pop" id="pop" hidden><div class="box"><span class="ttl" id="poptitle"></span><div class="pane" id="popbody"></div></div></div>
<div class="toast" id="toast" hidden></div>
<script id="keys">
'use strict';
/* F75: the page's keys and its bottom line, as plain functions of where the person is (no page in here, so
   tests/test_web.py drives them in node). route(c, e) gives the commands a key runs ([] leaves the key to the
   browser); footer(c, shown) the bottom line. c: {panel, panelName, focusMain, tab, tabs, typing, chatBox,
   popup, busy, selected, it: {newtask, newchat, ctl, task, k}, answerKeys}; e: {key, ctrl, meta, shift, alt}. */
function tabsFor(p,it){
  if(!it)return['info'];
  if(p===1)return it.k==='rel'?['release','chat','log']:['chat','log'];
  if(p===2)return it.newchat?['info']:it.ctl?['chat','pane','session']:it.task?['feed','pane','diff','session']:['feed','pane'];
  if(p===3)return it.newtask?['chat edit','direct edit']:['direct edit','chat edit'];
  if(p===4)return['answer','info'];
  return['preview'];
}
const QUICK={s:'since',y:'yesterday',w:'needs',u:'usage'};  /* a quick ask's key on its button */
const quickKey=key=>Object.keys(QUICK).find(k=>QUICK[k]===key)||'';
/* a Needs you item's possible answers, each with its key: yes / no (y, n), else the options' a, b, c… */
function answerOpts(it){
  if(!it)return[];
  let opts=Array.isArray(it.options)&&it.options.length?it.options.map(String):
    it.label==='CONFIRM'||/\byes ?(\/|or) ?no\b/i.test(it.ask||'')?['yes','no']:[];
  const used=new Set(),letters='abcdefg'.split(''),out=[];
  for(const o of opts){const w=o.toLowerCase();let key=w==='yes'?'y':w==='no'?'n':'';
    if(!key||used.has(key))key=letters.find(l=>!used.has(l))||'';
    if(key){used.add(key);out.push({key,label:o})}}
  return out;
}
const NOFOOT=/^(j|k|j\/k|\^h|\^l|\^h\/\^l)$/;
function route(c,e){
  const k=e.key,ctrl=e.ctrl||e.meta,it=c.it||{},p=c.panel,t=c.tab;
  if(c.popup)return k==='Escape'?[['closepop']]:[];
  if(ctrl&&!e.alt&&k.toLowerCase()==='s'&&c.focusMain&&t==='direct edit')return[['save']];
  if(e.ctrl&&!e.meta&&!e.alt&&(k==='h'||k==='l'))return[['side',k==='h'?'left':'right']];
  // B124: Ctrl+C interrupts a working chat (not over selected text, so copying works); Esc never does
  if(e.ctrl&&!e.meta&&!e.alt&&k.toLowerCase()==='c'&&c.busy&&(c.typing?c.chatBox:c.focusMain)&&!c.selected)return[['interrupt']];
  if(c.typing){
    if(k==='Escape')return[['blur']];
    if(k==='Enter'&&!e.shift&&c.chatBox)return[['send']];
    if(k==='Tab'&&c.focusMain&&t==='direct edit')return[['field',e.shift?-1:1]];
    return[];
  }
  if(ctrl||e.alt)return[];
  if(/^[1-5]$/.test(k))return[['panel',+k]];
  if(c.focusMain){
    if(k==='Escape')return[['back']];
    if(k==='h'||k==='ArrowLeft')return[c.tabs.indexOf(t)<=0?['back']:['tab',-1]];
    if(k==='l'||k==='ArrowRight')return[['tab',1]];
    if(t==='direct edit'){
      const m={t:['focus','f-title'],f:['focus','f-files'],a:['focus','f-after'],k:['cycle','f-kind',1],K:['cycle','f-kind',-1],p:['cycle','f-pri',1]};
      if(m[k])return[m[k]];
      if(k==='Tab')return[['field',e.shift?-1:1]];
      if(!it.newtask&&k==='D')return[['act','drop']];
      if(!it.newtask&&k==='H')return[['act','take']];
    }
    if(t==='answer'){const i=(c.answerKeys||[]).indexOf(k);if(i>=0)return[['answer',i]];if(k==='L')return[['act','later']]}
    if(t==='preview'){if(k==='j'||k==='ArrowDown')return[['opt',1]];if(k==='k'||k==='ArrowUp')return[['opt',-1]];
      if(k==='Enter')return[['go']];if(k==='O')return[['open']]}
    if(t==='chat'&&p===1&&QUICK[k])return[['quick',QUICK[k]]];
    if((t==='chat'||t==='feed')&&k==='v')return[['steps']];
    if(t==='release'){if(k==='Enter')return[['act','release']];if(k==='f')return[['act','release-now']]}
    if(t==='session'&&(k==='Enter'||k==='o'))return[['open']];
    if(t==='info'&&it.newchat&&(k==='Enter'||k==='N'))return[['newchat']];
    if(k==='i'||k==='Enter')return[['typebox']];
    if(k==='Tab')return[['panel',e.shift?(p+3)%5+1:p%5+1]];
  }else{
    if(k==='j'||k==='ArrowDown')return[['move',1]];
    if(k==='k'||k==='ArrowUp')return[['move',-1]];
    if(k==='l'||k==='Enter'||k==='ArrowRight')return[['into']];
    if(k==='Tab')return[['panel',e.shift?(p+3)%5+1:p%5+1]];
  }
  if(k==='?')return[['help']];
  if(k==='T')return[['appview']];
  if(k==='t')return[['theme']];
  if(k==='c')return[['chat']];
  if(p===1&&k==='R')return[['release']];
  if(p===2){if(k==='N')return[['newchat']];if(k==='o'&&(it.ctl||it.task))return[['open']];if(k==='v')return[['steps']]}
  if(p===3){
    if(k==='n')return[['newtask']];
    if(k==='E')return[['tabto','chat edit']];
    if(!it.newtask){if(k==='e')return[['tabto','direct edit']];if(it.parked&&k==='U')return[['act','unpark']];
      if(!it.parked&&(k==='J'||k==='K'))return[['reorder',k==='J'?1:-1]];
      if(!it.parked&&k==='p')return[['pri']];if(k==='H')return[['act','take']];if(k==='D')return[['act','drop']]}
  }
  if(p===4){if(k==='L')return[['act','later']];if(k==='a'||k==='i')return[['tabto','answer']]}
  if(p===5&&k==='O')return[['open']];
  return[];
}
/* the bottom line: the mode, this place's keys (yellow), then only 1-5, c and ? (blue). A key the window
   already shows (on a button, a label, a row: `shown`) is left out, and so are j/k and ^h/^l. */
function footer(c,shown){
  const it=c.it||{},t=c.tab;let here;
  if(c.typing)here=[...(c.busy&&c.chatBox?[['Ctrl+C','interrupts']]:[]),['Esc','leave'],...(c.chatBox?[['⇧⏎','new line']]:[]),...(c.focusMain&&t==='direct edit'?[['Tab','next field']]:[])];
  else if(c.focusMain){here=[['h/l','tab']];
    if(t==='direct edit')here.push(['Tab','next field'],['^S','save']);
    if(t==='chat'||t==='feed')here.push(['i','type'],['v','steps']);
    if(t==='chat edit'||t==='answer')here.push(['i','type']);
    if(t==='preview')here.push(['⏎','go with it'],['i','what to change'],['O','open on claude.ai']);
    if(t==='session')here.push(['o','open']);
    if(c.busy)here.push(['Ctrl+C','interrupts']);here.push(['Esc','back'])}
  else here=({1:[['⏎','open'],['R','release']],
    2:[['⏎','open'],['v','steps'],['N','new chat'],...(it.ctl||it.task?[['o','open session']]:[])],
    3:it.newtask?[['⏎','new task'],['E','describe it']]:it.parked?[['U','unpark'],['e','edit'],['E','chat edit'],['n','new'],['H','do it here'],['D','drop']]:[['e','edit'],['E','chat edit'],['n','new'],['J/K','reorder'],['p','priority'],['H','do it here'],['D','drop']],
    4:[['a','answer'],['L','later']],
    5:[['⏎','view'],['O','open on claude.ai']]})[c.panel]||[];
  here=here.filter(([k])=>!(shown||[]).includes(k)&&!NOFOOT.test(k));
  return{mode:c.typing?'INSERT':c.focusMain?String(t).toUpperCase():String(c.panelName||'').toUpperCase(),here,
    glob:c.typing?[]:[['1-5','panel'],['c','chat'],['?','keys']]};
}
/* B118: [3] Queue's groups. parkedLast(snap): the snapshot with its parked tasks (level later: a run never starts
   them) after the rest, so [3] lists [the queue, '+' new task, the Parked group] and a row's place in the queue
   is still its place in snap.queue. */
const isParked=q=>!!q&&q.state==='parked';
function parkedLast(snap){
  if(!snap||!Array.isArray(snap.queue))return snap;
  return{...snap,queue:[...snap.queue.filter(q=>!isParked(q)),...snap.queue.filter(isParked)]};
}
function queueItems(queue){const q=queue||[];return[...q.filter(x=>!isParked(x)),{id:'+',newtask:true},...q.filter(isParked)]}
if(typeof module!=='undefined')module.exports={tabsFor,route,footer,answerOpts,quickKey,parkedLast,queueItems};
</script>
<script id="moves">
'use strict';
/* B117: Shift+J / Shift+K in [3] Queue, optimistic. Each press swaps the task in o.S.snap.queue and moves the
   selection at once, then sends the plan move in the background, chained so fast presses go in order. While
   moves are pending a snapshot keeps the local queue order; once they drain (or one fails, which is toasted and
   drops the moves after it) the server's snapshot is fetched and taken, the selection following the task.
   o: {S, send(tid, where, other) -> Promise<{ok,out}>, fetch() -> Promise<snapshot>, toast(m, bad), render()}
   (no page in here, so tests/test_web.py drives it in node). */
function queueMoves(o){
  let chain=Promise.resolve(),pending=0,failed=false,last='';
  function settle(){
    if(--pending)return;
    failed=false;
    o.fetch().then(s=>{if(pending||!s||!s.queue)return;o.S.snap=s;follow();o.render()}).catch(()=>{});
  }
  function follow(){const i=o.S.snap.queue.findIndex(t=>t.id===last);if(i>=0)o.S.cur[3]=i}
  function press(step){
    const q=o.S.snap.queue,i=o.S.cur[3],it=q[i];if(!it)return false;
    if(i+step<0||i+step>=q.length){o.toast(`${it.id} is already ${step>0?'last':'first'}`);return false}
    const other=q[i+step],nq=q.slice();nq[i]=other;nq[i+step]=it;
    o.S.snap={...o.S.snap,queue:nq};o.S.cur[3]=i+step;last=it.id;pending++;o.render();
    const where=step>0?'after':'before';
    chain=chain.then(()=>failed?null:o.send(it.id,where,other.id).catch(e=>({ok:false,out:String(e)})))
      .then(r=>{if(r&&!r.ok){failed=true;o.toast(`could not move ${it.id} ${where} ${other.id}`+(r.out?'\n'+String(r.out).slice(0,400):''),true)}settle()});
    return true;
  }

}

<script>

/* the session feed: the agent's words, the person's, tool steps folded as '· N steps' (v shows them) */
function feedHTML(name,showTools){

function conceptParse(html,title){

    if(box===h){const parts=[];let n=h.nextElementSibling;while(n&&!(n.matches('h1,h2,h3,h4')))parts.push(clean(n.textContent)),n=n.nextElementSibling;opts.push({name:clean(h.textContent),text:parts.filter(Boolean),cls:''})}

    opts:opts.map(o=>({...o,rec:/recommend/i.test(o.name)||/\b(r|rec|recommended)\b/.test(o.cls)}))};
}
function conceptHTML(it){

    .then(h=>{S.concepts[id]=h?conceptParse(h,it.title):{none:true};const os=S.concepts[id].opts||[];const r=os.findIndex(o=>o.rec);

<span class="d">build ${esc(it.id)} waits for your OK · </span>${link}`;
}
function optMove(step){const it=sel(),id=it&&(it.concept||it.id),c=S.concepts[id];if(!c||!c.opts||!c.opts.length)return;
  S.copt[id]=Math.max(0,Math.min((S.copt[id]??0)+step,c.opts.length-1));S.sig='';renderMain();$('.opt.sel')?.scrollIntoView({block:'nearest'})}
function optName(){const it=sel(),id=it&&(it.concept||it.id),c=S.concepts[id];return c&&c.opts&&c.opts[S.copt[id]??0]?.name||''}

function paneHTML(it,tab){

  else if(tab==='release'){h=`${S.snap.release?esc(S.snap.release):'<span class="d">no release is queued</span>'}

A release starts like any other task; with [plan] release_alone it waits for everything ahead of it, then runs alone.

<span class="btnrow"><button class="kb p" data-act="release">${K('⏎','queue a release')}</button> <button class="kb" data-act="release-now">${K('f','release now, without waiting')}</button></span>`}
  else if(tab==='chat'||tab==='feed'){const name=sessionOf(it);if(!S.feeds[name])loadFeed(name);h=feedHTML(name,tab==='chat'?!S.showTools:S.showTools);  /* a chat shows its steps as a Claude session does, v hides them; a feed folds them, v shows them */

const STICKY=new Set(['direct edit','pane','preview']);  /* tabs a snapshot does not redraw: an edit, a live pane */

    $('#extra').innerHTML=x;S.extraSig=sig;
    for(const el of document.querySelectorAll('#extra textarea,#extra input,#pane textarea,#pane input,#pane select')){
      const dk=sig+':'+(el.id||el.closest('form')?.dataset.form||'');el.dataset.dk=dk;if(S.draft[dk]!==undefined)el.value=S.draft[dk]}
    if($('#f-after'))$('#f-ahint').textContent=afterHint($('#f-after').value);
  }
  if(/log|chat|feed/.test(tab)&&(keep||sig!==S.sig))pane.scrollTop=1e9;
  S.sig=sig;
}
function paneOnly(){const [tab]=curTab();if(['chat','feed','diff'].includes(tab)){S.sig+='~';renderMain();renderFoot()}}
/* the keys the place in focus already shows: the main pane's buttons and labels, or the panel's row hints */
function shownKeys(){return[...document.querySelectorAll(S.focusMain?'#main .pk':'#left .box.cur-panel .row .pk')].map(x=>x.textContent)}
function renderFoot(){
  const f=footer(ctx(),shownKeys());
  const fmt=a=>a.map(([k,v])=>`<span class="k">${esc(k)}</span> ${esc(v)}`).join(' · ');
  $('#foot').innerHTML=`<span class="mode">${esc(f.mode)}</span>`+fmt(f.here)+(f.glob.length?`<span class="gsep">│</span><span class="glob">${fmt(f.glob)}</span>`:'');
}
function render(){renderLeft();renderMain();renderFoot()}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,bad?8000:4000)}

/* F90: the run's version from the first snapshot that has one; a later, different one (the run restarted on an
   upgrade) reloads the page for its new HTML and JS. None (an older run): nothing. */
let RUN_VERSION='';
function followVersion(v){if(!v)return false;if(!RUN_VERSION){RUN_VERSION=v;return false}
  if(v!==RUN_VERSION){location.reload();return true}return false}
/* live updates: the snapshot over server-sent events; the open feed every 2 s, the built-in pane every 0.5 s */
function connect(){
  const es=new EventSource('events?t='+encodeURIComponent(T));
  es.onmessage=e=>{
    const snap=parkedLast(JSON.parse(e.data));  // B118: the Parked group last
    if(snap.error){toast('snapshot: '+snap.error,true);return}
    if(followVersion(snap.version))return;
    S.snap=MOVES.snap(snap);S.last=Date.now();$('#live').classList.add('on');follow();
    renderLeft();renderMain();renderFoot();
  };
  es.onerror=()=>{$('#live').classList.remove('on');$('#live').textContent='reconnecting…'};
}
setInterval(()=>{if(!S.last)return;const s=Math.round((Date.now()-S.last)/1000);$('#live').textContent='live · '+(s<5?'just now':s+'s ago')},1000);
setInterval(()=>{if(!T)return;const it=sel(),[tab]=curTab();if((tab==='chat'||tab==='feed')&&it){const n=sessionOf(it);if(S.feeds[n])S.feeds[n].loading=false;loadFeed(n)}},2000);

/* actions */
function back(){S.focusMain=false;if(typing())document.activeElement.blur();render()}
function boxOf(form){return document.querySelector(`#extra form[data-form="${form}"] textarea, #extra form[data-form="${form}"] input`)}
function submit(kind){
  const it=sel(),box=boxOf(kind),v=box?box.value.trim():'';
  if(kind==='send'){if(!v)return;const name=sessionOf(it),es=(S.feeds[name]||{}).entries||[];
    S.busy[name]={at:Date.now(),last:JSON.stringify(es[es.length-1]||null)};
    (S.feeds[name]=S.feeds[name]||{entries:[]}).entries=[...es,{kind:'you',text:v}];
    box.value='';dropDraft(box);paneOnly();box.focus();
    act('chat_to',{to:name,text:v},'sent to '+name).then(r=>{if(!r.ok)delete S.busy[name];renderFoot()});return}
  if(kind==='edit'){
    const text=$('#f-title').value.trim();if(!text){toast('Write what the task is first.',true);return}
    const a={text,files:$('#f-files').value.trim(),after:$('#f-after').value.trim(),pri:$('#f-pri').value};
    const done=r=>{if(r.ok){for(const el of document.querySelectorAll('#pane [data-dk]'))delete S.draft[el.dataset.dk];saveDrafts();S.sig='';back()}};
    if(it.newtask)act('plan_add',{kind:$('#f-kind').value,...a},'queued').then(done);
    else{if(text===it.title)delete a.text;if(a.pri===it.pri)a.pri='';if(a.files===list(it.files))a.files='';if(a.after===list(it.after))a.after='';
      act('plan_change',{tid:it.id,...a},'saved '+it.id).then(done)}
    return}
  if(!v)return;
  box.value='';dropDraft(box);
  if(kind==='chatedit'){const text=it.newtask?'new task: '+v:`change ${it.id} (${it.title}): ${v}`;act('chat',{text},'sent to c1');back()}
  if(kind==='answer'){act('answer',{tid:it.id,text:v},it.id+' answered').then(r=>{if(r.ok)back()})}
  if(kind==='pick'){act('answer',{tid:it.id,text:v},'sent to c1')}
}
/* F72: Shift+J / Shift+K in [3] Queue: the selected task one place down / up (plan move ID after|before
   <neighbour>); B117: optimistic, through queueMoves (the moves script above) */
const MOVES=queueMoves({S,send:(tid,where,other)=>api('act',{name:'move',args:{tid,where,other}}),
  fetch:()=>api('snapshot').then(parkedLast),toast,render});
function reorder(step){MOVES.press(step)}
function follow(){
  if(!S.follow)return;const i=queueItems(S.snap.queue).findIndex(t=>t.id===S.follow);  // B118: [3]'s rows, Parked after '+'
  if(i>=0){S.cur[3]=i;S.follow=''}
}
function openLink(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function doAct(a){
  const it=sel();
  if(a==='release')act('release',{},'release queued');
  if(a==='release-now')act('release',{now:true},'release queued, now');
  if(a==='later'&&it&&S.panel===4)act('shelve',{tid:it.id},it.id+' shelved').then(r=>{if(r.ok)back()});
  if(a==='drop'&&it&&S.panel===3&&!it.newtask)openPop('Drop '+it.id,`${esc(it.title)}\n\n<form class="form" data-form="drop"><label>why<input id="dwhy" autocomplete="off"></label><div class="btnrow"><button class="kb p">${K('⏎','drop '+esc(it.id))}</button> <button type="button" class="kb" data-close>${K('Esc','keep it')}</button></div></form>`,'#dwhy');
  if(a==='open')openIt();
  if(a==='unpark'&&it&&S.panel===3&&isParked(it))act('unpark',{tid:it.id},it.id+' unparked: it joins Follow-ups');  // B118
  if(a==='take'&&it&&S.panel===3&&!it.newtask)act('take',{tid:it.id},'c1 takes '+it.id);
  if(a==='newchat')act('new_control',{},'started a new control session').then(r=>{if(r.ok&&r.link)toast('new control session:\n'+r.link)});
}
function openIt(){
  const it=sel();if(!it)return;
  if(S.panel===5){if(it.url)openLink(it.url);else toast('no claude.ai page for '+it.id,true);return}
  if(S.panel!==2)return;
  if(it.link){openLink(it.link);return}
  if(isCtl(it)){toast(`${it.name} has no claude.ai/code link`,true);return}
  if(it.task)act('open_session',{slot:it.name},'opened '+it.name).then(r=>{if(r.ok&&/^https:/.test(r.out||''))openLink(r.out)});
}
function openPop(title,html,focus){$('#poptitle').textContent=title;$('#popbody').innerHTML=html;$('#pop').hidden=false;if(focus)setTimeout(()=>$(focus)?.focus(),0)}
function closePop(){$('#pop').hidden=true;renderFoot()}
function release(){S.panel=1;S.cur[1]=items().length-1;S.focusMain=true;S.tab[keyOf(sel())]='release';render()}
function help(){openPop('Keybindings',`<span class="r">Everywhere</span>
  <span class="b">1-5</span>    a panel              <span class="b">Tab</span>    next panel
  <span class="b">j/k</span>    move down / up       <span class="b">l ⏎</span>    into the main pane
  <span class="b">h/l</span>    previous / next tab  <span class="b">Esc</span>    back to the panels
  <span class="b">^h ^l</span>  left / right side    <span class="b">c</span>      chat with c1
  <span class="b">i</span>      type in the box      <span class="b">?</span>      this list
  <span class="b">T</span>      App view (the run app)  <span class="b">t</span>      theme (this browser)

<span class="r">Status [1]</span>      <span class="b">R</span> release   <span class="b">s y w u</span> quick asks in its chat
<span class="r">Sessions [2]</span>    <span class="b">N</span> new chat  <span class="b">o</span> open the session  <span class="b">v</span> show tool steps
  a chat: <span class="b">⏎</span> sends, <span class="b">⇧⏎</span> new line, <span class="b">Ctrl+C</span> interrupts while it works, <span class="b">Esc</span> leaves
<span class="r">Queue [3]</span>
  <span class="b">e</span>      direct edit          <span class="b">E</span>      chat edit
  <span class="b">n</span>      new task             <span class="b">J/K</span>    move the task down / up
  <span class="b">p</span>      priority on / off    <span class="b">H</span>      do it here
  <span class="b">D</span>      drop                 <span class="b">U</span>      unpark (a Parked task)
  in a direct edit: <span class="b">t k p f a</span> what, kind (<span class="b">K</span> back), priority, files, after
                    <span class="b">Tab</span> next field, <span class="b">^S</span> save
<span class="r">Needs you [4]</span>   <span class="b">a</span> answer  <span class="b">y n a b c</span> an answer's key  <span class="b">L</span> later
<span class="r">Concepts [5]</span>    <span class="b">j/k</span> option  <span class="b">⏎</span> go with it  <span class="b">i</span> what to change  <span class="b">O</span> open on claude.ai

<span class="d">Esc closes this.</span>`)}
/* F69: themes. The server writes [ui] theme into style#theme and every theme's tokens into THEMES; T picks one
   for this browser (localStorage), 'as the run is set' goes back to [ui] theme. */
const THEMES=/*THEMES*/{"default":"ryha","themes":{}};
const THEME_KEY='agent-runner.theme';
const THEME_LABEL={ryha:'ryha: black, red accent',omarchy:'omarchy: the current Omarchy theme',terminal:"terminal: the terminal's 16 colours",light:'light'};
function savedTheme(){try{return localStorage.getItem(THEME_KEY)||''}catch(e){return ''}}
function applyTheme(name){
  const t=THEMES.themes[name]||THEMES.themes[THEMES.default];if(!t)return;
  $('#theme').textContent=':root{'+Object.entries(t).filter(([k])=>k!=='mode').map(([k,v])=>`--${k}:${v}`).join(';')+
    `;color-scheme:${t.mode==='light'?'light':'dark'}}`;
}
function setTheme(name){try{name?localStorage.setItem(THEME_KEY,name):localStorage.removeItem(THEME_KEY)}catch(e){}applyTheme(name||THEMES.default);closePop();toast('theme: '+(name||THEMES.default+' (as the run is set)'))}
function themePicker(){
  const cur=savedTheme();
  const sw=t=>['bg','fg','accent','green','yellow','blue'].map(k=>`<span class="sw" style="background:${esc(t[k])}"></span>`).join('');
  openPop('Theme',`<div class="themes">${Object.entries(THEMES.themes).map(([n,t])=>`<button class="kb ${n===cur?'p':''}" data-theme="${esc(n)}">${sw(t)} ${esc(THEME_LABEL[n]||n)}</button>`).join('')}
<button class="kb ${cur?'':'p'}" data-theme="">as the run is set ([ui] theme = ${esc(THEMES.default)})</button></div>
<span class="d">Remembered in this browser. Esc closes this.</span>`,'.themes .kb.p');
}
if(savedTheme())applyTheme(savedTheme());
/* F81: App view (T, or the top bar's link) goes to the run app and this browser remembers it, so the run page's
   link opens the run app next time; the run app's 'Terminal view' comes back here. */
const VIEW_KEY='agent-runner.view';
function rememberView(v){try{localStorage.setItem(VIEW_KEY,v)}catch(e){}}
function appView(){rememberView('app');location.href='./'+location.search}
$('#appview').href='./'+location.search;
function setTab(name,focus){const [,ts,key]=curTab();if(!ts.includes(name))return false;S.tab[key]=name;S.focusMain=true;render();if(focus)setTimeout(focusBox,0);return true}
function focusBox(){const i=[...document.querySelectorAll('#extra textarea,#extra input,#pane textarea,#pane input')].find(x=>!x.disabled);if(i){S.focusMain=true;renderLeft();$('#main').classList.add('on');i.focus();renderFoot()}}
const FIELDS=['f-title','f-kind','f-pri','f-files','f-after'];

/* run one command route() gave */
function run(cmd){
  const [c,a,b]=cmd,its=items();
  switch(c){
    case 'closepop':closePop();return;
    case 'save':submit('edit');return;
    case 'side':if(typing())document.activeElement.blur();S.focusMain=a==='right';render();return;
    case 'blur':document.activeElement.blur();renderFoot();return;
    case 'interrupt':{const n=sessionOf(sel());delete S.busy[n];act('interrupt',{session:n},'interrupted '+n).then(()=>{if(S.feeds[n])S.feeds[n].loading=false;loadFeed(n);renderFoot()});return}
    case 'send':submit(document.activeElement.closest('form')?.dataset.form||'send');return;
    case 'field':{const els=FIELDS.map(id=>document.getElementById(id)).filter(x=>x&&!x.disabled);const i=els.indexOf(document.activeElement);
      const n=i<0?(a>0?0:els.length-1):(i+a+els.length)%els.length;els[n]?.focus();renderFoot();return}
    case 'panel':S.panel=a;S.focusMain=false;if(typing())document.activeElement.blur();render();return;
    case 'back':back();return;
    case 'tab':{const [t,ts,key]=curTab();S.tab[key]=ts[Math.max(0,Math.min(ts.indexOf(t)+a,ts.length-1))];S.focusMain=true;render();return}
    case 'focus':document.getElementById(a)?.focus();renderFoot();return;
    case 'cycle':{const el=document.getElementById(a);if(!el)return;
      if(el.disabled){toast(a==='f-kind'?"the kind is the id's letter: it stays":'');return}
      if(a==='f-pri')el.value=el.value==='critical'?'normal':'critical';
      else el.selectedIndex=(el.selectedIndex+b+el.options.length)%el.options.length;
      el.dispatchEvent(new Event('input',{bubbles:true}));renderFoot();return}
    case 'move':S.cur[S.panel]=Math.max(0,Math.min(S.cur[S.panel]+a,its.length-1));render();return;
    case 'into':S.focusMain=true;render();return;
    case 'act':doAct(a);return;
    case 'answer':{const it=sel(),o=answerOpts(it)[a];if(o)act('answer',{tid:it.id,text:o.label},`${it.id}: ${o.label}`).then(r=>{if(r.ok)back()});return}
    case 'opt':optMove(a);return;
    case 'go':{const it=sel(),o=optName();if(!o){focusBox();return}act('answer',{tid:it.id,text:'go with '+o},'sent to c1: go with '+o);return}
    case 'open':openIt();return;
    case 'quick':act('quick_ask',{key:a},'asked c1');S.busy.c1={at:Date.now(),last:JSON.stringify(((S.feeds.c1||{}).entries||[]).slice(-1)[0]||null)};return;
    case 'steps':S.showTools=!S.showTools;S.sig='';render();return;
    case 'typebox':focusBox();return;
    case 'help':help();return;
    case 'theme':themePicker();return;
    case 'appview':appView();return;
    case 'chat':{S.panel=2;S.cur[2]=Math.max(0,S.snap.sessions.findIndex(s=>s.name==='c1'));S.tab['2:c1']='chat';S.focusMain=true;render();setTimeout(focusBox,0);return}
    case 'release':release();return;
    case 'newchat':doAct('newchat');return;
    case 'newtask':S.cur[3]=queueItems(S.snap.queue).findIndex(x=>x.newtask);S.tab['3:+']='chat edit';S.focusMain=true;render();setTimeout(focusBox,0);return;
    case 'tabto':setTab(a,true);return;
    case 'reorder':{const q=S.snap.queue,i=S.cur[3];if(isParked(q[i])||isParked(q[i+a]))return;reorder(a);return}  // B118: not into or out of Parked
    case 'pri':{const q=sel();act('plan_change',{tid:q.id,pri:q.pri==='critical'?'normal':'critical'},`${q.id} is ${q.pri==='critical'?'normal':'critical'} now`);return}
  }
}
document.addEventListener('keydown',e=>{
  const cmds=route(ctx(),{key:e.key,ctrl:e.ctrlKey,meta:e.metaKey,shift:e.shiftKey,alt:e.altKey});
  if(!cmds.length)return;
  e.preventDefault();cmds.forEach(run);
});
document.addEventListener('focusin',renderFoot);
document.addEventListener('focusout',()=>setTimeout(renderFoot,0));
document.addEventListener('input',e=>{
  const el=e.target;if(el.dataset&&el.dataset.dk){S.draft[el.dataset.dk]=el.value;saveDrafts()}
  if(el.id==='f-after')$('#f-ahint').textContent=afterHint(el.value);
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closePop();return}
  if(e.target.id==='pop'){closePop();return}
  if(e.target.closest('[data-viewsw]')){rememberView('app');return}
  const th=e.target.closest('[data-theme]');if(th){setTheme(th.dataset.theme);return}
  const r=e.target.closest('[data-p]');if(r){S.panel=+r.dataset.p;S.cur[S.panel]=+r.dataset.i;S.focusMain=matchMedia('(max-width:760px)').matches||S.focusMain;render();return}
  const b=e.target.closest('[data-panel]');if(b){S.panel=+b.dataset.panel;S.focusMain=false;render();return}
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const q=e.target.closest('[data-quick]');if(q){run(['quick',q.dataset.quick]);return}
  const an=e.target.closest('[data-answer]');if(an){run(['answer',+an.dataset.answer]);return}
  const o=e.target.closest('[data-opt]');if(o){const it=sel();S.copt[it.concept||it.id]=+o.dataset.opt;S.sig='';renderMain();return}
  const a=e.target.closest('[data-act]');if(a){e.preventDefault();doAct(a.dataset.act);return}
  const m=e.target.closest('[data-mnav]');if(m){S.panel=+m.dataset.mnav;S.focusMain=false;render();return}
  if(e.target.closest('[data-back]')){back();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.dataset.form==='drop'){const it=sel(),why=$('#dwhy').value.trim();if(!why){toast('Say why, for the plan.',true);return}
    closePop();act('drop',{tid:it.id,why},'dropped '+it.id).then(r=>{if(r.ok)back()});return}
  submit(e.target.dataset.form);
});
$('#helpbtn').onclick=help;$('#themebtn').onclick=themePicker;
if(!T){$('#live').textContent='no token: open the address `status` prints'}
else{api('snapshot').then(s=>{if(s&&s.status){if(followVersion(s.version))return;S.snap=MOVES.snap(parkedLast(s));S.last=Date.now()}render()});connect()}
render();
</script>
</body></html>
